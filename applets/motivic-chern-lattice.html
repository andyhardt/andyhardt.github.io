    '−(1−t) ' + sp_('(−1)', S_CD) + sp_('t', S_DR)],
  dual: [
    sp_('(−t x)', S_ALL),
    sp_('t', S_CR) + sp_('x', S_ALL) + '(−1/x + ' + sp_('t', S_C) + '/y)',
    sp_('(−t)', S_1C) + sp_('t', S_CR) + sp_('x', S_ALL + '−1'),
    '(t−1) ' + sp_('x', '−1') + sp_('(−t)', S_CR) + sp_('x', S_ALL + '+1'),
    '(t−1) ' + sp_('x', '−1') + sp_('(−t)', S_CD) + sp_('t', S_DR) + sp_('x', S_ALL),
    '(t−1) ' + sp_('y', '−1') + sp_('(−1)', S_CD) + sp_('t', S_DR) + sp_('x', S_ALL)]
};
const FIG_NUMBER = {
  whittaker: PAPER.figWhittaker, ktheoretic: PAPER.figK, dual: PAPER.figDual
};

function weightTableHtml(fam) {
  let t = '<table class="fig"><tr>';
  for (let k = 0; k < 6; k++) t += '<td class="h">Case ' + (k + 1) + '</td>';
  t += '</tr><tr>';
  for (let k = 0; k < 6; k++) {
    const f = FIG_CASES[k];
    t += '<td>' + refVertex(f[0], f[1], f[2], f[3]) +
      '<div class="wf">' + FIG_FORMULAS[fam][k] + '</div></td>';
  }
  return t + '</tr></table>';
}

const R_ENTRIES = [
  ['+', '+', '+', '+', 'x<sub>j</sub> − t x<sub>i</sub>'],
  ['c', 'c', 'c', 'c', 'x<sub>i</sub> − t x<sub>j</sub>'],
  ['c', '+', '+', 'c', '(1−t) x<sub>i</sub>'],
  ['+', 'c', 'c', '+', '(1−t) x<sub>j</sub>'],
  ['+', 'c', '+', 'c', 't(x<sub>i</sub> − x<sub>j</sub>)'],
  ['c', '+', 'c', '+', 'x<sub>i</sub> − x<sub>j</sub>'],
  ['c', 'd', 'd', 'c', '(1−t) x<sub>i</sub>'],
  ['c', 'd', 'c', 'd', 't(x<sub>i</sub> − x<sub>j</sub>)'],
  ['d', 'c', 'c', 'd', '(1−t) x<sub>j</sub>'],
  ['d', 'c', 'd', 'c', 'x<sub>i</sub> − x<sub>j</sub>']
];

function referenceHtml() {
  const objRow = (id, formula) => {
    const p = PRESET_BY_ID[id];
    const inp = Object.assign(defaultInput(), { preset: id, n: 3 });
    fixArity(inp);
    const s = buildSpec(inp);
    return '<tr><td class="nm">' + s.title + '</td><td>' + formula + '</td>' +
      '<td class="rf">' + (s.ref || '—') + '</td></tr>';
  };

  let h = '';
  h += '<div class="card"><h2>The lattice models</h2>' +
    '<p>A rectangular grid with <b>n</b> rows, numbered 1…n from the top, and <b>N</b> ' +
    'columns, numbered 1…N <em>from the right</em>. The row parameter of row <i>i</i> is ' +
    '<i>x<sub>i</sub></i>; the column parameter of column <i>j</i> is <i>y<sub>j</sub></i>. ' +
    'There are colours <i>c</i><sub>1</sub> &lt; … &lt; <i>c<sub>r</sub></i>, always taken ' +
    'here with r = n.</p>' +
    '<p>A horizontal edge carries a colour or the uncoloured spin ⊕, drawn <b>+</b>. A ' +
    'vertical edge carries a <em>set</em> Σ of colours, so several colours may share a ' +
    'vertical edge, but never two copies of the same colour. A decorated grid is an ' +
    '<em>admissible state</em> (Definition ' + PAPER.defState + ') when every vertex ' +
    'matches one of the six cases below. Colours then trace out paths that move down and ' +
    'to the right (Remark ' + PAPER.remPaths + '), entering at the top and leaving at the ' +
    'right.</p>' +
    '<p>The Boltzmann weight of a state is the product of its vertex weights, and the ' +
    'partition function is the sum over admissible states. A configuration not listed in ' +
    'the tables has weight 0 and is inadmissible; that is <em>not</em> the same as a listed ' +
    'weight that happens to vanish at a specialisation — those states are still states, ' +
    'and the viewer shows them.</p></div>';

  h += '<div class="card"><h2>Boundary conditions <i>B</i>(σ, w, λ)</h2>' +
    '<p>Definition ' + PAPER.defBoundary + '. For permutations σ, w in S<sub>n</sub> and a ' +
    'partition N ≥ λ<sub>1</sub> ≥ … ≥ λ<sub>n</sub> &gt; 0:</p><ul>' +
    '<li>the top boundary edge in column λ<sub>i</sub> carries the colour σ(n+1−i), and ' +
    'every other top edge is uncoloured — so a repeated part of λ puts several colours on ' +
    'one column;</li>' +
    '<li>the right boundary edge in row <i>i</i> carries the colour w(<i>i</i>);</li>' +
    '<li>the left and bottom boundaries are uncoloured.</li></ul>' +
    '<p>When λ has repeated parts, σ is only determined up to the stabiliser of ' +
    'w<sub>0</sub>·λ; Section 4 always takes the maximal-length representative, and the ' +
    'Explore page offers it when your σ is not that one. On the square, ' +
    'λ = □ = (n, n−1, …, 1).</p></div>';

  for (const fam of WEIGHT_FAMILIES) {
    const cap = {
      whittaker: 'Setting every y<sub>j</sub> = 0 recovers the Iwahori Whittaker models ' +
        'of Brubaker–Buciumas–Bump–Gustafsson.',
      ktheoretic: 'Obtained from the Whittaker weights by dividing by y whenever the edge ' +
        'to the left of the vertex carries a colour, and then replacing x by −x. These are ' +
        'the weights used for the motivic Chern classes and the stable envelopes.',
      dual: 'Obtained from the K-theoretic weights by inverting x and y and multiplying by ' +
        'x<sup>b</sup>y<sup>−l</sup>, where b is the number of colours on the bottom edge ' +
        'and l the number on the left edge.'
    }[fam];
    h += '<div class="card"><h2>' + FAMILY_LABEL[fam] + ' weights</h2>' +
      '<div class="formula">Figure ' + FIG_NUMBER[fam] + ' of the paper</div>' +
      '<div class="scroller">' + weightTableHtml(fam) + '</div>' +
      '<p class="hint">' + cap + ' Throughout, c &lt; d are colours, Σ is the set on the ' +
      'top edge, Σ<sup>±</sup><sub>c</sub> means Σ with c added or removed, ' +
      'Σ<sup>+−</sup><sub>cd</sub> = (Σ ∪ {c}) ∖ {d}, and |Σ<sub>(c,d)</sub>| counts the ' +
      'colours of Σ strictly between c and d.</p></div>';
  }

  h += '<div class="card"><h2>The R-matrix</h2>' +
    '<div class="formula">Figure ' + PAPER.figR + '; solvability is Theorem ' +
    PAPER.thmYBE + '</div><div class="scroller"><table class="fig"><tr>';
  R_ENTRIES.forEach(e => { h += '<td>' + refRVertex(e[0], e[1], e[2], e[3]) + '</td>'; });
  h += '</tr><tr>';
  R_ENTRIES.forEach(e => { h += '<td class="wf">' + e[4] + '</td>'; });
  h += '</tr></table></div>' +
    '<p class="hint">The two strands run bottom-left → top-right and top-left → ' +
    'bottom-right; x<sub>i</sub> and x<sub>j</sub> are the two row parameters, and c &lt; d ' +
    'are colours. The same R-matrix works for the Whittaker and the K-theoretic weights. ' +
    'The Yang–Baxter equation (Figure ' + PAPER.figYBE + ') is the statement that the two ' +
    'three-vertex configurations have the same partition function for every choice of the ' +
    'six boundary labels; the Checks panel on the Explore page verifies it here.</p></div>';

  h += '<div class="card"><h2>What the objects are</h2>' +
    '<p>Every entry of the Object menu is the partition function of one of the models ' +
    'above, on the boundary shown, times an explicit factor. The Explore page always ' +
    'displays the partition function, the factor and the product separately.</p>' +
    '<div class="scroller"><table class="fig obj"><tr><th>object</th>' +
    '<th>as a partition function</th><th>where</th></tr>';
  h += objRow('Z', 'the partition function itself, K-theoretic weights');
  h += objRow('Omega', 'the partition function itself, Whittaker weights; ' +
    'Ω<sup>λ</sup><sub>σ,w</sub>(x;y) = (∏<sub>j</sub> y<sub>j</sub><sup>#{i : λ<sub>i</sub>&gt;j}</sup>) ' +
    'Z<sup>λ</sup><sub>σ,w</sub>(−x;y) &nbsp;<span class="rf">(Prop. ' + PAPER.propOmegaZ + ')</span>');
  h += objRow('Ztilde', 'the partition function itself, dual weights; ' +
    'Z̃<sup>□</sup><sub>σ,w</sub>(x;y) = x<sup>ρ</sup>y<sup>−ρ</sup> ' +
    'Z<sup>□</sup><sub>σ,w</sub>(x<sup>−1</sup>;y<sup>−1</sup>) ' +
    '<span class="rf">(Prop. ' + PAPER.propDual + ')</span>');
  h += objRow('MCvX', '(−t)<sup>−ℓ(w)</sup> Z<sup>□</sup><sub>1,w₀w</sub>(x; y<sub>w₀</sub>)');
  h += objRow('MCvY', '(−t)<sup>−ℓ(w⁻¹w₀)</sup> Z<sup>□</sup><sub>1,w</sub>(x; y)');
  h += objRow('MCX', '(−1)<sup>ℓ(w₀)</sup> Z̃<sup>□</sup><sub>1,w₀w</sub>(x; y<sub>w₀</sub>)');
  h += objRow('MCY', '(−1)<sup>ℓ(w₀)</sup> Z̃<sup>□</sup><sub>1,w</sub>(x; y)');
  h += objRow('stabm', '(−1)<sup>ℓ(w₀)</sup> q<sup>ℓ(w₀)−ℓ(w)/2</sup> r(x<sub>w₀</sub>;y) ' +
    'Z<sup>□</sup><sub>1,w</sub>(x<sup>−1</sup>;y<sup>−1</sup>), &nbsp; q = t<sup>−1</sup>');
  h += objRow('stabp', 'q<sup>ℓ(w₀)−ℓ(w)/2</sup> r(x;y<sub>w₀</sub>) ' +
    'Z<sup>□</sup><sub>w₀,w</sub>(x<sup>−1</sup>;y<sub>w₀</sub><sup>−1</sup>)');
  h += objRow('stabu', '(−1)<sup>ℓ(uw₀)</sup> q<sup>ℓ(w₀)−ℓ(w)/2</sup> ' +
    'r(x<sub>(uw₀)⁻¹</sub>;y<sub>u</sub>) Z<sup>□</sup><sub>u,w</sub>' +
    '(x<sup>−1</sup>;(y<sub>u</sub>)<sup>−1</sup>)');
  h += objRow('rpoly', 'φ<sub>v⁻¹</sub><sup>−1</sup> Z<sup>□</sup><sub>1,u⁻¹</sub>|<sub>v⁻¹</sub>, ' +
    'q = t; the restricted weights are Figure ' + PAPER.figRPoly);
  h += objRow('iwahori', 'Ω<sup>λ</sup><sub>σ,w</sub>(z;0), the y → 0 specialisation');
  h += objRow('factorial', 'Σ<sub>w∈S<sub>n</sub></sub> Ω<sup>λ+□</sup><sub>σ,w</sub>(x;y) ' +
    '= (∏<sub>i&lt;j</sub>(x<sub>i</sub>−t x<sub>j</sub>)) s<sub>λ</sub>(x|y); the ' +
    'colour-blind model is Figure ' + PAPER.figBMN);
  h += objRow('groth', '(−1)<sup>ℓ(w⁻¹w₀)</sup> Z<sup>□</sup><sub>1,w</sub>(x;y) at t = 0; ' +
    'the surviving states are the reduced pipe dreams, weights as in Figure ' +
    PAPER.figPipe);
  h += '</table></div>' +
    '<p class="hint">φ<sub>w</sub>(y) = ∏<sub>α∈Φ⁺, w⁻¹α∈Φ⁺</sub>(q y<sup>−α</sup> − 1) ' +
    '∏<sub>α∈Φ⁺, w⁻¹α∈Φ⁻</sub>(1 − y<sup>−α</sup>), and ' +
    'r(x;y) = (−1)<sup>ℓ(w₀)</sup> x<sup>ρ</sup>y<sup>−ρ</sup> with ρ = (n−1, …, 0). ' +
    'The restriction f|<sub>u</sub> means f(y<sub>u(1)</sub>, …, y<sub>u(n)</sub>; ' +
    'y<sub>1</sub>, …, y<sub>n</sub>).</p></div>';

  h += '<div class="card"><h2>Restriction and specialisation</h2>' +
    '<p>The restriction f|<sub>u</sub> means f(y<sub>u(1)</sub>, …, y<sub>u(n)</sub>; ' +
    'y<sub>1</sub>, …, y<sub>n</sub>). More generally, for a composition μ with distinct ' +
    'parts, f|<sub>μ</sub>(y) = f(y<sub>μ(1)</sub>, …, y<sub>μ(n)</sub>; y). Writing ' +
    'μ<sub>i</sub> = ν<sub>u(i)</sub> with ν the decreasing rearrangement, Remark ' +
    PAPER.remComposition + ' gives Z<sup>λ</sup><sub>σ,w</sub>|<sub>νu</sub> = 0 ' +
    'unless ν = λ and u ≤ w₀σ⁻¹w (for |ν| ≤ |λ|). The Explore page reports ν, u and w₀σ⁻¹w ' +
    'whenever the specialisation is of this form.</p></div>';

  h += '<div class="card"><h2>How this was checked</h2>' +
    '<p>The engine was written twice: once in JavaScript, which runs here, and once in ' +
    'Python from the paper, as an independent reference. They agree on the state sets and ' +
    'on every Boltzmann weight over 704 boundary conditions and 14154 states for all three ' +
    'weight families, and on every object in the menu.</p>' +
    '<p>The Python reference verifies the paper\'s statements at random rational points ' +
    'with exact arithmetic: Example ' + PAPER.exPartFun + ' vertex by vertex, the ' +
    'Yang–Baxter equation for every boundary choice with up to three colours, Propositions ' +
    PAPER.propBase + ', ' + PAPER.propRec + ', ' + PAPER.propSpecRec + ', ' +
    PAPER.propVanish + ', Theorem ' + PAPER.thmZ + ', all of Sections 5, 6 and 7, and the ' +
    'special cases of Section 8 including the pipe dreams. The Checks panel on the Explore ' +
    'page re-runs the polynomial identities live.</p>' +
    '<p>Sampling, when the Examples page falls back to it, is a depth-first search with the ' +
    'successors at each vertex shuffled: varied, but not uniform.</p>' +
    '<p>Factoring pulls out the integer content and the monomial factor, then divides out ' +
    'binomial factors — 1 − x<sub>i</sub>/y<sub>j</sub>, t − 1, x<sub>i</sub> − t x<sub>j</sub> ' +
    'and the like — repeatedly. The binomial search is exhaustive: the ratio of the two ' +
    'monomials of a binomial factor must be the ratio of two monomials of the polynomial, so ' +
    'the candidates are read off it. An irreducible factor with three or more terms is not ' +
    'found; it is left in the cofactor and shown as such. Every factorisation is multiplied ' +
    'back out and compared with the input before it is displayed.</p></div>';
  return h;
}

const HELP_HTML = `
<p>A viewer for the solvable lattice models of Brubaker, Bump, Hardt and Spink,
<i>Lattice Models for Double Whittaker Polynomials and Motivic Chern Classes</i>
(arXiv:2509.17312v1). It enumerates the admissible states for a choice of boundary
conditions, draws each one the way the paper draws them, computes every Boltzmann weight
exactly, and sums them into the partition function.</p>
<p>Everything is exact: weights and partition functions are Laurent polynomials in
<i>t</i><sup>1/2</sup>, <i>x</i><sub>1</sub>…<i>x<sub>n</sub></i>,
<i>y</i><sub>1</sub>…<i>y<sub>N</sub></i> (and any parameters you introduce) with integer
coefficients. Nothing is evaluated numerically.</p>
<p>The <b>Reference</b> page describes the models, the boundary conditions, all the weight
tables and what each object in the menu is. This page is about driving the calculator.</p>

<h3>Object</h3>
<p>What you want to see. The three entries under “Partition function” are the models
themselves, with the K-theoretic, Whittaker and dual weights. The rest are the named objects
of the paper. Choosing one fixes the boundary data, the weights and any specialisation the
object carries, and the card at the top then shows three things separately: the partition
function, the normalising factor, and their product.</p>

<h3>Lattice and boundary data</h3>
<p><b>n</b> rows, and the number of colours is taken equal to n. <b>N</b> columns, which you
may raise above λ<sub>1</sub> freely; objects living on the square fix N = n and λ = □.
Permutations are typed in one-line notation (<kbd>1423</kbd> or <kbd>1,4,2,3</kbd>), λ as a
space-separated list. <b>Randomise</b> fills the boundary in but does not press Compute, so
you can see what it chose; permutations come out uniform, λ does not (its parts are drawn in
decreasing order) and λ<sub>1</sub> is capped so the follow-up computation stays quick.</p>

<h3>Specialisation</h3>
<p>Three levels, all applied to the partition function <em>and</em> to every vertex weight
shown, so the tables you read always match the numbers above them.</p>
<ul>
<li>The grid <i>x<sub>i</sub></i> ↦ q<sup>k</sup> <i>y<sub>j</sub></i>: pick a column for
each row, and a power of q. Taking every k = 0 and j = u(i) is the restriction
|<sub>u</sub> of Section 4.1, which is what produces the GKM localisations; the shortcut box
fills the grid from a permutation. Note that q means t<sup>−1</sup> for the stable envelopes
and t elsewhere — the box says which.</li>
<li>The two check boxes: <i>t</i> = 0 (the Grothendieck / pipe-dream degeneration) and every
<i>y<sub>j</sub></i> = 0 (the Iwahori Whittaker specialisation, legal only for the Whittaker
weights since the others involve <i>y</i><sup>−1</sup>).</li>
<li><b>Advanced substitutions</b>: a free-form list, one assignment per line, of the form
<kbd>variable = monomial</kbd>. The left-hand side is <i>t</i>, <i>x<sub>i</sub></i> or
<i>y<sub>j</sub></i>. The right-hand side is a signed monomial in <i>t</i> (or <i>q</i>),
the <i>x</i>’s, the <i>y</i>’s, and any new letters you introduce — those become free
parameters — or 0. Exponents are written <kbd>y2^-1</kbd> or <kbd>y2^{-1}</kbd>; division
with <kbd>/</kbd> works. All the assignments are made <em>simultaneously</em>, so
<kbd>x1 = y2</kbd> together with <kbd>y2 = x1</kbd> is the swap and not a contradiction.
Coefficients must be integers, and a variable that occurs to a negative power cannot be sent
to 0 or to a non-unit — the page says so rather than guessing.</li>
</ul>
<p>When an object has already spent a specialisation — <i>r<sub>u,v</sub></i> has already
substituted for the <i>x</i>’s, the Iwahori Whittaker entry has already set y = 0, the
Grothendieck entry t = 0 — the corresponding control is replaced by a line saying so.</p>

<h3>Advanced</h3>
<p><b>All states</b> enumerates everything and sums the partition function. <b>A few
states</b> draws a handful of states found at random (a depth-first search with the choices
at each vertex shuffled: varied, but not uniform) and computes no partition function.
<b>Automatic</b> does the first unless there are more states than the threshold, or the
search runs out of time, and then falls back to the second. The time limit applies to the
whole computation; if the search itself is cut short the state count is reported as a lower
bound and says so, and if only the weighting is cut short the count is still exact and the
partition function is withheld rather than shown wrong.</p>

<h3>Reading the states</h3>
<p>Click any thumbnail. You get the state drawn large, the Boltzmann weight of every vertex
laid out in the shape of the lattice — under the specialisation in force — the weight of the
state, and, under “Where these weights come from”, each distinct vertex type in this state
with the corresponding line of the weight table beside its value. <kbd>←</kbd> and
<kbd>→</kbd> step through the states.</p>
<p>“Hide the states killed by the specialisation” appears only when a specialisation is
active, and removes exactly the states with a vanishing vertex weight. Without a
specialisation there is nothing to hide: every admissible vertex has a nonzero weight.</p>

<h3>Factoring</h3>
<p>Every result is offered to a quick factoriser as it is computed; if it factors, the
factored form is what you see, and <b>Expand</b> multiplies it out again. If the quick
attempt finds nothing the answer is shown expanded, and <b>Factor</b> searches harder — for
up to the number of seconds set under Advanced — and says plainly if it still finds nothing.
The search covers monomial, integer and binomial factors, which is what these partition
functions are made of; an irreducible factor with three or more terms is left in the
cofactor rather than pretended away, and every factorisation is multiplied back out and
checked before it is shown.</p>

<h3>Checks</h3>
<p>The Checks panel at the foot of the page holds everything verification-related: the live
comparison of the partition function you are looking at with the closed form through the
divided-difference operators τ, and a self-test that re-derives the paper's statements as
exact polynomial identities. You should not have to look at it; it is there so that you can.</p>

<h3>Sharing</h3>
<p>One self-contained HTML file, no dependencies — mail it, or open it by double-clicking.
<b>Copy link</b> puts the current inputs in the URL. One caveat: Chrome will not start a Web
Worker from a <kbd>file://</kbd> page, so a double-clicked file runs the computation in the
page and the Stop button can only take effect at the time limit; serving the file over http
restores it.</p>
