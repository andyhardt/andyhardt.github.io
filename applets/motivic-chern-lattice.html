<title>Motivic Chern Lattice Viewer</title>
<style>

}

#pagesw{margin-left:auto}
.layout{display:grid;grid-template-columns:326px 1fr;gap:0;align-items:stretch}

aside{padding:16px 18px 40px;border-right:1px solid var(--line);background:var(--panel);

main{padding:16px 20px 80px;min-width:0}
.grp{margin-bottom:15px}
.grp>label.hd,.hd{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:600}
select,input[type=text],input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:13px}

.field{margin-bottom:9px}

.hint.err{color:var(--bad)}
.hint.fix{color:var(--warn);cursor:pointer;text-decoration:underline dotted}

button.tiny{padding:3px 8px;font-size:12px}

<body>
<header class="top">
  <h1>Motivic Chern Lattice Viewer</h1>
  <div class="sub">States and partition functions from Brubaker&ndash;Bump&ndash;Hardt&ndash;Spink
    (<a href="https://arxiv.org/abs/2509.17312">arXiv:2509.17312</a>)</div>
  <div class="seg" id="pagesw">
    <button data-page="explore" class="on">Examples</button>
    <button data-page="reference">Reference</button>
  </div>
  <div class="tools">
    <button id="btn-link" class="tiny" title="Copy a link that restores these inputs">Copy link</button>
    <button id="btn-theme" class="tiny" title="Light / dark">◐</button>
    <button id="btn-help" class="tiny">?</button>
  </div>
</header>
<div class="layout" id="layout">
<aside id="controls"></aside>
<main id="main"></main>
</div>
<div id="refpage" style="display:none"></div>

<script id="engine">
/* ------------------------------------------------------------------------
   Exact Laurent polynomials over Z in the variables
        t^{1/2},  x_1..x_n,  y_1..y_N
   Coefficients are BigInt.  The exponent of t is stored DOUBLED, so that
   half-integer powers (which occur in the stable-envelope normalisations
   q^{l(w)/2}) are exact.
   ------------------------------------------------------------------------ */

/** extras: names of extra free parameters introduced by an advanced
 *  specialisation (a, b, ...).  They are only added when actually used, so the
 *  common case pays nothing for them. */
function makeRing(n, N, extras) {
  extras = extras || [];
  const slots = [{ name: 't', kind: 't' }];
  for (let i = 1; i <= n; i++) slots.push({ name: 'x', kind: 'x', idx: i });
  for (let j = 1; j <= N; j++) slots.push({ name: 'y', kind: 'y', idx: j });
  for (const e of extras) slots.push({ name: e, kind: 'p' });
  return {
    n: n, N: N, extras: extras.slice(), nv: slots.length, slots: slots,
    names: slots.map(s => s.kind === 'p' || s.kind === 't' ? s.name : s.name + s.idx),
    xi: function (i) { return i; },            // slot of x_i   (i = 1..n)
    yj: function (j) { return n + j; },        // slot of y_j   (j = 1..N)
    pk: function (name) { return 1 + n + N + extras.indexOf(name); }
  };
}

function keyOf(e) { return e.join(','); }
function expOf(k) { return k.split(',').map(Number); }

function P_zero(ring) { return { ring: ring, terms: new Map() }; }

function P_mono(ring, coeff, e) {
  const m = new Map();
  const c = BigInt(coeff);
  if (c !== 0n) m.set(keyOf(e), c);
  return { ring: ring, terms: m };
}

function P_const(ring, c) {
  return P_mono(ring, c, new Array(ring.nv).fill(0));
}

function P_var(ring, slot, power) {
  const e = new Array(ring.nv).fill(0);
  e[slot] = power;
  return P_mono(ring, 1, e);
}

/** t^(k/2): pass the exponent in halves. */
function P_thalf(ring, halves) { return P_var(ring, 0, halves); }
function P_t(ring, k) { return P_var(ring, 0, 2 * k); }

function P_isZero(p) { return p.terms.size === 0; }

function P_add(a, b) {
  const m = new Map(a.terms);
  for (const [k, v] of b.terms) {
    const s = (m.get(k) || 0n) + v;
    if (s === 0n) m.delete(k); else m.set(k, s);
  }
  return { ring: a.ring, terms: m };
}

function P_neg(a) {
  const m = new Map();
  for (const [k, v] of a.terms) m.set(k, -v);
  return { ring: a.ring, terms: m };
}

function P_sub(a, b) { return P_add(a, P_neg(b)); }

function P_mul(a, b) {
  const nv = a.ring.nv;
  const m = new Map();
  for (const [ka, va] of a.terms) {
    const ea = expOf(ka);
    for (const [kb, vb] of b.terms) {
      const eb = expOf(kb);
      const e = new Array(nv);
      for (let i = 0; i < nv; i++) e[i] = ea[i] + eb[i];
      const k = keyOf(e);
      const s = (m.get(k) || 0n) + va * vb;
      if (s === 0n) m.delete(k); else m.set(k, s);
    }
  }
  return { ring: a.ring, terms: m };
}

/** In-place accumulation: acc += p.  Avoids copying a large accumulator. */
function P_addInto(acc, p) {
  for (const [k, v] of p.terms) {
    const s = (acc.terms.get(k) || 0n) + v;
    if (s === 0n) acc.terms.delete(k); else acc.terms.set(k, s);
  }
  return acc;
}

function P_scale(a, c) {
  const cc = BigInt(c);
  if (cc === 0n) return P_zero(a.ring);
  const m = new Map();
  for (const [k, v] of a.terms) m.set(k, v * cc);
  return { ring: a.ring, terms: m };
}

/** multiply by a single monomial (fast path) */
function P_mulMono(a, coeff, e) {
  const c = BigInt(coeff);
  if (c === 0n) return P_zero(a.ring);
  const nv = a.ring.nv;
  const m = new Map();
  for (const [k, v] of a.terms) {
    const ea = expOf(k);
    const f = new Array(nv);
    for (let i = 0; i < nv; i++) f[i] = ea[i] + e[i];
    m.set(keyOf(f), v * c);
  }
  return { ring: a.ring, terms: m };
}

function P_pow(a, k) {
  let r = P_const(a.ring, 1), b = a, e = k;
  while (e > 0) { if (e & 1) r = P_mul(r, b); b = P_mul(b, b); e >>= 1; }
  return r;
}

function P_equals(a, b) {
  if (a.terms.size !== b.terms.size) return false;
  for (const [k, v] of a.terms) if (b.terms.get(k) !== v) return false;
  return true;
}

function P_copy(a) { return { ring: a.ring, terms: new Map(a.terms) }; }

/** Substitute the variable in slot `slot` by the monomial coeff * prod v_i^{e_i}. */
function P_substMono(a, slot, coeff, e) {
  const nv = a.ring.nv;
  const m = new Map();
  for (const [k, v] of a.terms) {
    const ea = expOf(k);
    const p = ea[slot];
    const f = ea.slice();
    f[slot] = 0;
    for (let i = 0; i < nv; i++) f[i] += p * e[i];
    let c = v;
    if (coeff !== 1) {
      if (p >= 0) c = v * BigInt(coeff) ** BigInt(p);
      else throw new Error('negative power of a non-unit substitution');
    }
    const kk = keyOf(f);
    const s = (m.get(kk) || 0n) + c;
    if (s === 0n) m.delete(kk); else m.set(kk, s);
  }
  return { ring: a.ring, terms: m };
}

/** Set the variable in slot `slot` to 0.  Throws if a negative power occurs. */
function P_setZero(a, slot) {
  const m = new Map();
  for (const [k, v] of a.terms) {
    const e = expOf(k);
    if (e[slot] > 0) continue;
    if (e[slot] < 0) throw new Error('cannot specialise ' + a.ring.names[slot] + ' to 0');
    m.set(k, v);
  }
  return { ring: a.ring, terms: m };
}

function P_hasNegativePower(a, slot) {
  for (const k of a.terms.keys()) if (expOf(k)[slot] < 0) return true;
  return false;
}

/** Exact division by (A*v - B) where A and B are monomials given as
 *  [coeffBigInt, exponentArray].  Returns null if the division is not exact. */
function P_divLinear(a, slot, A, B) {
  if (P_isZero(a)) return P_zero(a.ring);
  const nv = a.ring.nv;
  // collect coefficients of v^k
  const byDeg = new Map();
  let lo = Infinity, hi = -Infinity;
  for (const [k, v] of a.terms) {
    const e = expOf(k);
    const d = e[slot];
    e[slot] = 0;
    if (!byDeg.has(d)) byDeg.set(d, new Map());
    const mm = byDeg.get(d);
    const kk = keyOf(e);
    mm.set(kk, (mm.get(kk) || 0n) + v);
    if (d < lo) lo = d;
    if (d > hi) hi = d;
  }
  const coef = d => ({ ring: a.ring, terms: byDeg.get(d) || new Map() });
  if (hi === lo) return null;           // a nonzero multiple of A v - B spans >= 2 degrees
  let quotient = P_zero(a.ring);
  // q_{hi-1} = p_hi / A ;  q_{k-1} = (p_k + B q_k) / A
  let qk = null;
  for (let d = hi; d > lo; d--) {
    const num = d === hi ? coef(d) : P_add(coef(d), P_mulMono(qk, B[0], B[1]));
    const qq = P_divMono(num, A[0], A[1]);
    if (qq === null) return null;
    qk = qq;
    const shift = new Array(nv).fill(0);
    shift[slot] = d - 1;
    quotient = P_add(quotient, P_mulMono(qq, 1, shift));
  }
  const rem = P_add(coef(lo), P_mulMono(qk, B[0], B[1]));
  if (!P_isZero(rem)) return null;
  return quotient;
}

/* ------------------------------------------------------------ substitution */

/**
 * Simultaneous monomial substitution.  `subst` is an array indexed by slot;
 * an entry is null (leave alone), {zero:true} (set to 0) or
 * {coeff: BigInt, exps: [...]}  meaning that variable is replaced by
 * coeff * prod v_i^{exps[i]}.  Simultaneity is what makes
 * "x1 = y2, y2 = x1" mean the swap rather than something contradictory.
 * Throws if a variable set to 0 (or given a non-unit coefficient) occurs to a
 * negative power.
 */
function P_subst(p, subst) {
  const ring = p.ring, nv = ring.nv;
  const out = new Map();
  outer:
  for (const [k, v] of p.terms) {
    const e = expOf(k);
    const f = new Array(nv).fill(0);
    let c = v;
    for (let i = 0; i < nv; i++) {
      const ei = e[i];
      if (!ei) continue;
      const s = subst[i];
      if (!s) { f[i] += ei; continue; }
      if (s.zero) {
        if (ei > 0) continue outer;              // the whole term vanishes
        throw new Error('cannot set ' + ring.names[i] + ' to 0: it occurs to the power ' + ei);
      }
      if (s.coeff !== 1n) {
        if (ei < 0 && s.coeff !== -1n) {
          throw new Error(ring.names[i] + ' occurs to the power ' + ei +
            ', so it cannot be replaced by a value with coefficient ' + s.coeff);
        }
        c *= s.coeff ** BigInt(ei < 0 ? -ei : ei);
        if (ei < 0 && s.coeff === -1n && (-ei) % 2 === 1) { /* (-1)^{-1} = -1 */ }
      }
      for (let j = 0; j < nv; j++) if (s.exps[j]) f[j] += s.exps[j] * ei;
    }
    const kk = keyOf(f);
    const t = (out.get(kk) || 0n) + c;
    if (t === 0n) out.delete(kk); else out.set(kk, t);
  }
  return { ring: ring, terms: out };
}

function identitySubst(ring) { return new Array(ring.nv).fill(null); }

/** Exact division by a monomial coeff * prod v^e. */
function P_divMono(a, coeff, e) {
  const nv = a.ring.nv;
  const c = BigInt(coeff);
  const m = new Map();
  for (const [k, v] of a.terms) {
    if (v % c !== 0n) return null;
    const ea = expOf(k);
    const f = new Array(nv);
    for (let i = 0; i < nv; i++) f[i] = ea[i] - e[i];
    m.set(keyOf(f), v / c);
  }
  return { ring: a.ring, terms: m };
}

/** Divide by (x_a - x_b) style binomials: v1 - v2 with both variables. */
function P_divDiff(a, slotA, slotB) {
  const nv = a.ring.nv;
  const A = [1n, new Array(nv).fill(0)];
  const B = [1n, new Array(nv).fill(0)];
  B[1][slotB] = 1;
  return P_divLinear(a, slotA, A, B);
}

/**
 * Exact division by the binomial  alpha + beta * z^R,  where R is an exponent
 * vector and z^R the corresponding monomial.  Returns the quotient, or null if
 * the division is not exact.
 *
 * Grade the exponents by L(e) = e . R.  The divisor has L-values 0 and
 * S = R . R > 0, so subtracting a multiple of the divisor at grade g only
 * touches grades g and g + S.  Working through the grades in increasing order
 * therefore determines the quotient one grade at a time, with no back-tracking.
 */
function P_divBinomial(p, alpha, beta, R) {
  if (P_isZero(p)) return P_zero(p.ring);
  const nv = p.ring.nv;
  let S = 0;
  for (let i = 0; i < nv; i++) S += R[i] * R[i];
  if (S === 0) return null;
  const L = e => { let g = 0; for (let i = 0; i < nv; i++) g += e[i] * R[i]; return g; };

  const rem = new Map();                       // key -> coefficient
  const byGrade = new Map();                   // grade -> Set(key)
  const grades = [];
  let gMax = -Infinity;
  const addKey = (k, g) => {
    if (!byGrade.has(g)) {
      byGrade.set(g, new Set());
      let lo = 0, hi = grades.length;
      while (lo < hi) { const m = (lo + hi) >> 1; if (grades[m] < g) lo = m + 1; else hi = m; }
      grades.splice(lo, 0, g);
    }
    byGrade.get(g).add(k);
  };
  for (const [k, v] of p.terms) {
    const g = L(expOf(k));
    rem.set(k, v); addKey(k, g);
    if (g > gMax) gMax = g;
  }
  // p = q * (alpha + beta z^R) forces deg_L(q) = deg_L(p) - S, so nothing above
  // that grade can be a quotient term; without this bound 1/(1-t) would run away
  // as a power series.
  const q = new Map();
  for (let gi = 0; gi < grades.length; gi++) {
    if (grades[gi] > gMax - S) break;
    const keys = Array.from(byGrade.get(grades[gi]));
    for (const k of keys) {
      const c = rem.get(k);
      if (c === undefined || c === 0n) continue;
      if (c % alpha !== 0n) return null;
      const qc = c / alpha;
      q.set(k, (q.get(k) || 0n) + qc);
      rem.delete(k);
      const e = expOf(k);
      const f = new Array(nv);
      for (let i = 0; i < nv; i++) f[i] = e[i] + R[i];
      const k2 = keyOf(f);
      const nvl = (rem.get(k2) || 0n) - qc * beta;
      if (nvl === 0n) rem.delete(k2);
      else { rem.set(k2, nvl); addKey(k2, grades[gi] + S); }
    }
  }
  for (const v of rem.values()) if (v !== 0n) return null;
  for (const [k, v] of q) if (v === 0n) q.delete(k);
  return { ring: p.ring, terms: q };
}

/** The integer content (gcd of the coefficients), with the sign of the term
 *  that the display puts first. */
function P_content(p) {
  let g = 0n;
  for (const v of p.terms.values()) {
    let a = v < 0n ? -v : v;
    while (a) { const t = g % a; g = a; a = t; }
  }
  return g;
}

/** The largest monomial dividing every term (per variable, the minimum
 *  exponent -- meaningful for Laurent polynomials too). */
function P_monomialGcd(p) {
  const nv = p.ring.nv;
  let m = null;
  for (const k of p.terms.keys()) {
    const e = expOf(k);
    if (!m) { m = e.slice(); continue; }
    for (let i = 0; i < nv; i++) if (e[i] < m[i]) m[i] = e[i];
  }
  return m || new Array(nv).fill(0);
}

/* ---------------------------------------------------------------- ordering */

function P_termList(p) {
  const out = [];
  for (const [k, v] of p.terms) out.push({ e: expOf(k), c: v });
  const n = p.ring.n;
  const xdeg = e => { let s = 0; for (let i = 1; i <= n; i++) s += e[i]; return s; };
  out.sort((a, b) => {
    // lowest total x-degree first, so a binomial reads "1 - x/y" as the paper
    // writes it in Example 4.2, then lowest power of t, then lexicographic
    const da = xdeg(a.e), db = xdeg(b.e);
    if (da !== db) return da - db;
    if (a.e[0] !== b.e[0]) return b.e[0] - a.e[0];   // "t - 1", as in Example 4.2
    // then the shortest monomial first, so a binomial reads "1 - y2/y1"
    const supp = e => e.reduce((s, u) => s + (u ? 1 : 0), 0);
    const sa = supp(a.e), sb = supp(b.e);
    if (sa !== sb) return sa - sb;
    for (let i = a.e.length - 1; i >= 0; i--) if (a.e[i] !== b.e[i]) return b.e[i] - a.e[i];
    return 0;
  });
  return out;
}

function P_numTerms(p) { return p.terms.size; }

/* ------------------------------------------------------------------------
   The lattice model of Brubaker-Bump-Hardt-Spink, arXiv:2509.17312.

   Conventions, from Section 3 and Definition 4.1 of the paper:
     * n rows, numbered 1..n from top to bottom;
     * N columns, numbered 1..N from RIGHT to LEFT;
     * colours c_1 < ... < c_r are the integers 1..r, and the uncoloured
       horizontal spin (+) is 0;
     * vertical edges carry a SET of colours, stored as a bitmask;
     * a vertex is (left, top, right, bottom), matching the paper's
       \vertex{#1}{#2}{#3}{#4}.

   Internally a state stores its vertical cuts and horizontal edges in
   DRAWING order (left to right); position k from the left is column N-k.
   ------------------------------------------------------------------------ */

const PLUS = 0;

function bit(c) { return 1 << (c - 1); }
function popcount(m) { let c = 0; while (m) { m &= m - 1; c++; } return c; }
function maskCount(mask, lo, hi) {           // |Sigma cap [lo,hi]|
  if (hi < lo) return 0;
  const m = ((hi >= 31 ? -1 : ((1 << hi) - 1)) & ~((1 << (lo - 1)) - 1));
  return popcount(mask & m);
}
function maskList(m) {
  const out = [];
  for (let c = 1; m; c++, m >>= 1) if (m & 1) out.push(c);
  return out;
}

/* --------------------------------------------------------------- the cases */

/** Which of the six cases of Figure 1 / Figure 4?  0 if inadmissible. */
function vertexCase(left, top, right, bottom) {
  if (left === PLUS && right === PLUS) return top === bottom ? 1 : 0;
  if (left !== PLUS && left === right) return top === bottom ? 2 : 0;
  if (left === PLUS) {                       // right is a colour
    const c = right;
    return ((top & bit(c)) && bottom === (top & ~bit(c))) ? 3 : 0;
  }
  if (right === PLUS) {                      // left is a colour
    const c = left;
    return (!(top & bit(c)) && bottom === (top | bit(c))) ? 4 : 0;
  }
  const c = Math.min(left, right), d = Math.max(left, right);
  if (left < right) {                        // Case 5
    return (!(top & bit(c)) && (top & bit(d)) && bottom === ((top | bit(c)) & ~bit(d))) ? 5 : 0;
  }
  return (!(top & bit(d)) && (top & bit(c)) && bottom === ((top | bit(d)) & ~bit(c))) ? 6 : 0;
}

/* ------------------------------------------------------------- the weights */

/* Figure 1, the Whittaker weights:
     1  \vertex{+}{S}{+}{S}              (-t)^{S_[1,r]}
     2  \vertex{c}{S}{c}{S}              t^{S_(c,r]} (x + t^{S_c} y)
     3  \vertex{+}{S}{c}{S^-_c}          (-t)^{S_[1,c)} t^{S_(c,r]}
     4  \vertex{c}{S}{+}{S^+_c}          (1-t) x (-t)^{S_(c,r]}
     5  \vertex{c}{S}{d}{S^{+-}_{cd}}    (1-t) x (-t)^{S_(c,d)} t^{S_(d,r]}
     6  \vertex{d}{S}{c}{S^{+-}_{dc}}   -y (1-t) (-1)^{S_(c,d)} t^{S_(d,r]}
   Figure 4, the K-theoretic weights: divide by y when the left edge carries a
   colour, then replace x by -x.
   Figure 8, the dual weights: invert x and y in Figure 4, then multiply by
   x^b y^{-l}, b = #colours on the bottom edge, l = #colours on the left edge.
   All three tables are transcribed independently below and the derivations are
   checked against each other in the self-test.                             */

const WEIGHT_FAMILIES = ['ktheoretic', 'whittaker', 'dual'];

const FAMILY_LABEL = { ktheoretic: 'K-theoretic', whittaker: 'Whittaker', dual: 'dual' };

/** Build the Boltzmann weight as an exact Laurent polynomial.
 *  xs = slot of x_i, ys = slot of y_j. */
function vertexWeight(ring, family, cas, left, top, right, r, xs, ys) {
  const nv = ring.nv;
  const E = () => new Array(nv).fill(0);
  const S = top;
  const nS = maskCount(S, 1, r);
  let c, d, p, a, b;

  function mono(sign, tPow, xPow, yPow) {
    const e = E();
    e[0] = 2 * tPow;
    if (xPow) e[xs] += xPow;
    if (yPow) e[ys] += yPow;
    return P_mono(ring, sign, e);
  }

  if (family === 'whittaker') {
    switch (cas) {
      case 1: return mono(nS % 2 ? -1 : 1, nS, 0, 0);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return P_add(mono(1, a, 1, 0), mono(1, a + b, 0, 1));
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return mono(p % 2 ? -1 : 1, p + a, 0, 0);
      case 4:
        c = left; a = maskCount(S, c + 1, r);
        return P_add(mono(a % 2 ? -1 : 1, a, 1, 0), mono(a % 2 ? 1 : -1, a + 1, 1, 0));
      case 5:
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? -1 : 1, p + a, 1, 0), mono(p % 2 ? 1 : -1, p + a + 1, 1, 0));
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? 1 : -1, a, 0, 1), mono(p % 2 ? -1 : 1, a + 1, 0, 1));
    }
  } else if (family === 'ktheoretic') {
    switch (cas) {
      case 1: return mono(nS % 2 ? -1 : 1, nS, 0, 0);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return P_add(mono(-1, a, 1, -1), mono(1, a + b, 0, 0));
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return mono(p % 2 ? -1 : 1, p + a, 0, 0);
      case 4:
        c = left; a = maskCount(S, c + 1, r);
        return P_add(mono(a % 2 ? 1 : -1, a, 1, -1), mono(a % 2 ? -1 : 1, a + 1, 1, -1));
      case 5:
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? 1 : -1, p + a, 1, -1), mono(p % 2 ? -1 : 1, p + a + 1, 1, -1));
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? 1 : -1, a, 0, 0), mono(p % 2 ? -1 : 1, a + 1, 0, 0));
    }
  } else if (family === 'dual') {
    switch (cas) {
      case 1: return mono(nS % 2 ? -1 : 1, nS, nS, 0);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return P_add(mono(-1, a, nS - 1, 0), mono(1, a + b, nS, -1));
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return mono(p % 2 ? -1 : 1, p + a, nS - 1, 0);
      case 4:   // (t-1) x^{-1} (-t)^{S_(c,r]} x^{S+1} = (-1)^a (t^{a+1} - t^a) x^{|S|}
        c = left; a = maskCount(S, c + 1, r);
        return P_add(mono(a % 2 ? -1 : 1, a + 1, nS, 0), mono(a % 2 ? 1 : -1, a, nS, 0));
      case 5:   // (t-1) x^{-1} (-t)^{S_(c,d)} t^{S_(d,r]} x^{|S|}
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? -1 : 1, p + a + 1, nS - 1, 0),
                     mono(p % 2 ? 1 : -1, p + a, nS - 1, 0));
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return P_add(mono(p % 2 ? -1 : 1, a + 1, nS, -1), mono(p % 2 ? 1 : -1, a, nS, -1));
    }
  }
  return P_zero(ring);
}

/* --------------------------------------------------------------- boundaries */

/** Definition 4.1: B(sigma, w, lambda).
 *  top[j-1] is the set of colours on the top boundary edge of column j;
 *  right[i-1] the colour on the right boundary of row i. */
function boundaryFromData(n, N, r, sigma, w, lam) {
  const top = new Array(N).fill(0);
  for (let i = 1; i <= n; i++) top[lam[i - 1] - 1] |= bit(sigma[n - i]);
  const right = [];
  for (let i = 1; i <= n; i++) right.push(w[i - 1]);
  return { n: n, N: N, r: r, top: top, right: right,
           left: new Array(n).fill(PLUS), bottom: new Array(N).fill(0) };
}

function topDrawn(bd) { return bd.top.slice().reverse(); }
function bottomDrawn(bd) { return bd.bottom.slice().reverse(); }

/* -------------------------------------------------------------- enumeration */

/** Colour counts that must sit on the vertical cut below row i. */
function requiredMasks(bd) {
  const n = bd.n, r = bd.r;
  const need = [];
  const cnt = new Array(r + 1).fill(0);
  for (const m of bd.top) for (const c of maskList(m)) cnt[c]++;
  for (let i = 1; i <= n; i++) {
    if (bd.left[i - 1] !== PLUS) cnt[bd.left[i - 1]]++;
    if (bd.right[i - 1] !== PLUS) cnt[bd.right[i - 1]]--;
    need.push(cnt.slice());
  }
  return need;
}

/**
 * Enumerate admissible states.
 *
 * `opts` may carry { limit, deadline, onState }.  Returns
 *   { states, count, searchTruncated, storeTruncated }
 * where `count` is the exact number of admissible states unless
 * `searchTruncated` is set, in which case it is a lower bound, and
 * `storeTruncated` says that only the first `limit` states were kept (the
 * count is still exact).
 */
function enumerateStates(bd, opts) {
  opts = opts || {};
  const n = bd.n, N = bd.N, r = bd.r;
  const limit = opts.limit === undefined ? Infinity : opts.limit;
  const deadline = opts.deadline === undefined ? Infinity : opts.deadline;
  const shuffle = !!opts.shuffle;
  const rnd = opts.rnd || Math.random;
  const need = requiredMasks(bd);
  const needMask = need.map(cnt => {
    let m = 0;
    for (let c = 1; c <= r; c++) { if (cnt[c] < 0) return -1; if (cnt[c] > 0) m |= bit(c); }
    return m;
  });
  const bottomD = bottomDrawn(bd);
  const topD = topDrawn(bd);

  const states = [];
  let count = 0, searchTruncated = false, storeTruncated = false;
  if (needMask.some(m => m === -1)) return { states, count, searchTruncated, storeTruncated };

  // suffix unions of the tops of the current row, for pruning
  const horiz = new Array(n);
  const cuts = new Array(n + 1);
  cuts[0] = topD;
  let checkCounter = 0;

  function timeUp() {
    if (++checkCounter % 512 !== 0) return false;
    return Date.now() > deadline;
  }

  function doRow(i) {
    if (searchTruncated) return;
    if (i > n) {
      let ok = true;
      for (let k = 0; k < N; k++) if (cuts[n][k] !== bottomD[k]) { ok = false; break; }
      if (!ok) return;
      count++;
      if (states.length < limit) {
        states.push({
          cuts: cuts.map(c => c.slice()),
          horiz: horiz.map(h => h.slice())
        });
      } else storeTruncated = true;
      return;
    }
    const above = cuts[i - 1];
    const rowH = new Array(N + 1);
    rowH[0] = bd.left[i - 1];
    const rowB = new Array(N);
    // suffix union of tops
    const suffix = new Array(N + 1).fill(0);
    for (let k = N - 1; k >= 0; k--) suffix[k] = suffix[k + 1] | above[k];
    const want = needMask[i - 1];

    function doVertex(k, placed) {
      if (searchTruncated) return;
      if (timeUp()) { searchTruncated = true; return; }
      if (k === N) {
        if (rowH[N] !== bd.right[i - 1]) return;
        if (placed !== want) return;
        horiz[i - 1] = rowH.slice();
        cuts[i] = rowB.slice();
        doRow(i + 1);
        return;
      }
      const left = rowH[k], top = above[k];
      const avail = suffix[k] | (left === PLUS ? 0 : bit(left));
      // a colour still needed but neither placed nor available cannot appear
      if ((want & ~placed & ~avail) !== 0) return;

      const push = (right, bottom) => {
        // a colour left on the cut that is not wanted there can never leave
        if ((bottom & ~want) !== 0) return;
        rowH[k + 1] = right;
        rowB[k] = bottom;
        doVertex(k + 1, placed | bottom);
      };

      const moves = [];
      if (left === PLUS) {
        moves.push([PLUS, top]);                                     // Case 1
        for (const c of maskList(top)) moves.push([c, top & ~bit(c)]);  // Case 3
      } else {
        const c = left;
        moves.push([c, top]);                                        // Case 2
        if (!(top & bit(c))) {
          moves.push([PLUS, top | bit(c)]);                          // Case 4
          // Cases 5 (d > c) and 6 (d < c) have the same outgoing labels
          for (const d of maskList(top)) moves.push([d, (top | bit(c)) & ~bit(d)]);
        }
      }
      if (shuffle) {
        for (let a = moves.length - 1; a > 0; a--) {
          const b = Math.floor(rnd() * (a + 1));
          const tmp = moves[a]; moves[a] = moves[b]; moves[b] = tmp;
        }
      }
      for (const mv of moves) { push(mv[0], mv[1]); if (searchTruncated) return; }
    }
    doVertex(0, 0);
  }

  doRow(1);
  return { states, count, searchTruncated, storeTruncated };
}

/** Per-vertex records for a state: position, labels, case, weight.
 *  `subst`, if given, is applied to each weight, so what is shown is the
 *  Boltzmann weight under the specialisation actually in force. */
function stateVertices(bd, st, ring, family, subst) {
  const n = bd.n, N = bd.N, r = bd.r;
  const out = [];
  for (let i = 1; i <= n; i++) {
    for (let k = 0; k < N; k++) {
      const col = N - k;
      const left = st.horiz[i - 1][k], top = st.cuts[i - 1][k];
      const right = st.horiz[i - 1][k + 1], bottom = st.cuts[i][k];
      const cas = vertexCase(left, top, right, bottom);
      out.push({
        row: i, col: col, left: left, top: top, right: right, bottom: bottom,
        cas: cas,
        weight: cas ? applyOptionalSubst(
          vertexWeight(ring, family, cas, left, top, right, r, ring.xi(i), ring.yj(col)),
          subst) : P_zero(ring)
      });
    }
  }
  return out;
}

/** Product of the vertex weights.  Monomial factors are folded into a single
 *  monomial first (most vertices are monomials), then the binomials are
 *  multiplied in; this keeps the intermediate polynomials as small as
 *  possible. */
function applyOptionalSubst(p, subst) {
  if (!subst) return p;
  try { return P_subst(p, subst); } catch (e) { return p; }
}

function stateWeight(bd, st, ring, family, subst) {
  const nv = ring.nv;
  const e = new Array(nv).fill(0);
  let coeff = 1n;
  const rest = [];
  for (const v of stateVertices(bd, st, ring, family, subst)) {
    if (v.weight.terms.size === 0) return P_zero(ring);
    if (v.weight.terms.size === 1) {
      for (const [k, c] of v.weight.terms) {
        const ee = expOf(k);
        for (let i = 0; i < nv; i++) e[i] += ee[i];
        coeff *= c;
      }
    } else rest.push(v.weight);
  }
  let p = P_mono(ring, 1, e);
  p.terms.set(keyOf(e), coeff);
  for (const q of rest) p = P_mul(p, q);
  return p;
}

function partitionFunction(bd, states, ring, family, opts) {
  opts = opts || {};
  const deadline = opts.deadline === undefined ? Infinity : opts.deadline;
  const z = P_zero(ring);
  for (let i = 0; i < states.length; i++) {
    if ((i & 255) === 0 && Date.now() > deadline) return { poly: z, truncated: true, done: i };
    P_addInto(z, stateWeight(bd, states[i], ring, family, opts.subst));
  }
  return { poly: z, truncated: false, done: states.length };
}

/** A handful of states in random order, without enumerating the whole space.
 *  The order is not uniform: it is a depth-first search with the successors at
 *  each vertex shuffled, so states whose early choices have few completions are
 *  over-represented. */
function sampleStates(bd, k, deadline) {
  const seen = new Set();
  const out = [];
  const perTry = Math.max(200, Math.floor((deadline - Date.now()) / Math.max(1, k * 3)));
  for (let attempt = 0; attempt < k * 12 && out.length < k; attempt++) {
    if (Date.now() > deadline) break;
    const r = enumerateStates(bd, { limit: 1, shuffle: true,
      deadline: Math.min(deadline, Date.now() + perTry) });
    if (!r.states.length) break;
    const st = r.states[0];
    const key = JSON.stringify([st.cuts, st.horiz]);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(st);
  }
  return out;
}

/* ------------------------------------------------------------------------
   Permutations, divided-difference operators, and the named objects of the
   paper expressed through the lattice model.
   ------------------------------------------------------------------------ */

/* ------------------------------------------------------------ permutations */

function permId(n) { const p = []; for (let i = 1; i <= n; i++) p.push(i); return p; }
function permW0(n) { const p = []; for (let i = n; i >= 1; i--) p.push(i); return p; }
function permMul(a, b) { return a.map((_, i) => a[b[i] - 1]); }     // (ab)(i) = a(b(i))
function permInv(a) { const o = new Array(a.length); a.forEach((v, i) => o[v - 1] = i + 1); return o; }
function permLen(a) {
  let c = 0;
  for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) c++;
  return c;
}
function permSi(n, i) { const p = permId(n); p[i - 1] = i + 1; p[i] = i; return p; }
function permEq(a, b) { return a.length === b.length && a.every((v, i) => v === b[i]); }

function permAll(n) {
  if (n === 0) return [[]];
  const out = [];
  const rec = (cur, rest) => {
    if (!rest.length) { out.push(cur.slice()); return; }
    for (let i = 0; i < rest.length; i++) {
      cur.push(rest[i]);
      rec(cur, rest.slice(0, i).concat(rest.slice(i + 1)));
      cur.pop();
    }
  };
  rec([], permId(n));
  return out;
}

/** a reduced word [i_1,...,i_k] with a = s_{i_1} ... s_{i_k}. */
function reducedWord(a) {
  const n = a.length, w = a.slice(), word = [];
  for (;;) {
    let done = true;
    for (let i = 0; i < n - 1; i++) {
      if (w[i] > w[i + 1]) { const t = w[i]; w[i] = w[i + 1]; w[i + 1] = t; word.push(i + 1); done = false; break; }
    }
    if (done) break;
  }
  return word.reverse();
}

function bruhatLeq(u, v) {
  const n = u.length;
  for (let i = 1; i < n; i++) {
    const a = u.slice(0, i).sort((p, q) => q - p);
    const b = v.slice(0, i).sort((p, q) => q - p);
    for (let k = 0; k < i; k++) if (a[k] > b[k]) return false;
  }
  return true;
}

function permToString(p) { return p.join(''); }
function parsePerm(s, n) {
  s = (s || '').trim();
  if (!s) return null;
  let vals;
  if (s.indexOf(',') >= 0 || s.indexOf(' ') >= 0) vals = s.split(/[\s,]+/).filter(z => z).map(Number);
  else vals = s.split('').map(Number);
  if (vals.length !== n || vals.some(v => !(v >= 1 && v <= n))) return null;
  const seen = new Set(vals);
  if (seen.size !== n) return null;
  return vals;
}

/* ------------------------------------------------------- variable relabels */

/** spec[slot] = [targetSlot, multiplier]; missing entries mean identity. */
function P_relabel(p, spec) {
  const nv = p.ring.nv;
  const m = new Map();
  for (const [k, v] of p.terms) {
    const e = expOf(k);
    const f = new Array(nv).fill(0);
    for (let i = 0; i < nv; i++) {
      if (!e[i]) continue;
      const s = spec[i];
      if (s) f[s[0]] += s[1] * e[i]; else f[i] += e[i];
    }
    const kk = keyOf(f);
    const s = (m.get(kk) || 0n) + v;
    if (s === 0n) m.delete(kk); else m.set(kk, s);
  }
  return { ring: p.ring, terms: m };
}

function identitySpec(ring) { return new Array(ring.nv).fill(null); }


/* --------------------------------------------------- divided differences */

/** tau_i f  =  (t-1)/(1-x^{a_i}) f + (x^{a_i}-t)/(1-x^{a_i}) (s_i f),
 *  cleared of denominators as
 *  [ (t-1) x_{i+1} f + (x_i - t x_{i+1}) (s_i f) ] / (x_{i+1} - x_i).       */
function tauApply(ring, i, f, inverse) {
  const sp = identitySpec(ring);
  sp[ring.xi(i)] = [ring.xi(i + 1), 1];
  sp[ring.xi(i + 1)] = [ring.xi(i), 1];
  const sf = P_relabel(f, sp);
  const E = () => new Array(ring.nv).fill(0);
  const xi = E(); xi[ring.xi(i)] = 1;
  const xi1 = E(); xi1[ring.xi(i + 1)] = 1;
  const txi1 = E(); txi1[0] = 2; txi1[ring.xi(i + 1)] = 1;

  let num;
  if (!inverse) {
    // (t-1) x_{i+1} f + (x_i - t x_{i+1}) s_i f
    const a = P_sub(P_mulMono(f, 1, (() => { const e = E(); e[0] = 2; e[ring.xi(i + 1)] = 1; return e; })()),
                    P_mulMono(f, 1, xi1));
    const b = P_sub(P_mulMono(sf, 1, xi), P_mulMono(sf, 1, txi1));
    num = P_add(a, b);
  } else {
    // [ (t-1) x_i f + (x_i - t x_{i+1}) s_i f ] / t
    const a = P_sub(P_mulMono(f, 1, (() => { const e = E(); e[0] = 2; e[ring.xi(i)] = 1; return e; })()),
                    P_mulMono(f, 1, xi));
    const b = P_sub(P_mulMono(sf, 1, xi), P_mulMono(sf, 1, txi1));
    num = P_mulMono(P_add(a, b), 1, (() => { const e = E(); e[0] = -2; return e; })());
  }
  const A = [1n, E()];
  const B = [1n, xi];
  const q = P_divLinear(num, ring.xi(i + 1), A, B);
  return q;
}

function tauWord(ring, f, word, inverse) {
  let g = f;
  if (!inverse) { for (let k = word.length - 1; k >= 0; k--) g = tauApply(ring, word[k], g, false); }
  else { for (let k = 0; k < word.length; k++) g = tauApply(ring, word[k], g, true); }
  return g;
}

/** the seed of Theorem 4.6:  prod_i prod_{j<lambda_i} (1 - x_i / y_j). */
function baseProduct(ring, lam) {
  let p = P_const(ring, 1);
  for (let i = 1; i <= lam.length; i++) {
    for (let j = 1; j < lam[i - 1]; j++) {
      const e = new Array(ring.nv).fill(0);
      e[ring.xi(i)] = 1; e[ring.yj(j)] = -1;
      p = P_mul(p, P_sub(P_const(ring, 1), P_mono(ring, 1, e)));
    }
  }
  return p;
}

/** Theorem 4.6:  Z^lambda_{sigma,w} = t^{l(sigma)} tau_w^{-1} tau_{sigma w_0} [seed],
 *  for sigma the maximal-length representative of its coset in S_n/Stab(w_0.lambda). */
function demazureZ(ring, n, sigma, w, lam) {
  const seed = baseProduct(ring, lam);
  let g = tauWord(ring, seed, reducedWord(permMul(sigma, permW0(n))), false);
  if (g === null) return null;
  g = tauWord(ring, g, reducedWord(w), true);
  if (g === null) return null;
  const e = new Array(ring.nv).fill(0);
  e[0] = 2 * permLen(sigma);
  return P_mulMono(g, 1, e);
}

/* ------------------------------------------------------- stabiliser cosets */

function stabOfReversedLambda(lam) {
  const n = lam.length;
  const rev = lam.slice().reverse();
  return permAll(n).filter(u => u.every((_, i) => rev[u[i] - 1] === rev[i]));
}

/** the maximal length element of sigma * Stab(w_0 . lambda) */
function maxCosetRep(sigma, lam) {
  let best = sigma, bl = -1;
  for (const h of stabOfReversedLambda(lam)) {
    const p = permMul(sigma, h);
    const l = permLen(p);
    if (l > bl) { bl = l; best = p; }
  }
  return best;
}




/* ------------------------------------------------------------------------
   Parsing user specialisations.

   A specialisation is a list of assignments  <variable> = <monomial>, applied
   SIMULTANEOUSLY, so that "x1 = y2, y2 = x1" means the swap rather than
   something contradictory.  The left-hand side must be one of x_i, y_j or t.
   The right-hand side is a signed monomial in t (or q), the x's, the y's, and
   any new free parameters the user cares to introduce (a, b, ...), or 0.

   Only unit coefficients are allowed on variables that occur to negative
   powers, because the coefficient ring is Z; the parser accepts any integer and
   the substitution itself reports the problem if one arises.
   ------------------------------------------------------------------------ */

const RESERVED = { t: 1, q: 1, x: 1, y: 1 };

/** Scan one monomial: returns {coeff, tHalves, vars:[{kind,idx,name,e}]} or {zero:true}. */
function scanMonomial(str, n, N, qsign, errors, where, extras) {
  let i = 0, sign = 1, coeff = 1, tHalves = 0;
  const vars = [];
  let sawAnything = false, isZero = false;
  const s = str.trim();
  const fail = m => { errors.push(where + ': ' + m); return null; };

  let dir = 1;                                  // +1 multiply, -1 divide
  while (i < s.length) {
    const ch = s[i];
    if (ch === ' ' || ch === '\t') { i++; continue; }
    if (ch === '*') { dir = 1; i++; continue; }
    if (ch === '/') { dir = -1; i++; continue; }
    if (ch === '+') { i++; continue; }
    if (ch === '-') { sign = -sign; i++; continue; }
    if (ch >= '0' && ch <= '9') {
      let j = i; while (j < s.length && s[j] >= '0' && s[j] <= '9') j++;
      const v = parseInt(s.slice(i, j), 10);
      i = j; sawAnything = true;
      if (v === 0) { isZero = true; continue; }
      if (dir === -1) {
        if (v !== 1) return fail('cannot divide by the integer ' + v +
          ' — coefficients are integers');
      } else coeff *= v;
      dir = 1;
      continue;
    }
    if (/[A-Za-z]/.test(ch)) {
      let j = i; while (j < s.length && /[A-Za-z]/.test(s[j])) j++;
      const name = s.slice(i, j);
      i = j;
      let idx = null;
      if (s[i] === '_') i++;
      if (i < s.length && /[0-9]/.test(s[i])) {
        let k = i; while (k < s.length && /[0-9]/.test(s[k])) k++;
        idx = parseInt(s.slice(i, k), 10); i = k;
      }
      let e = 1;
      if (s[i] === '^') {
        i++;
        let br = false;
        if (s[i] === '{') { br = true; i++; }
        let k = i;
        if (s[k] === '-') k++;
        while (k < s.length && /[0-9]/.test(s[k])) k++;
        if (k === i) return fail('missing exponent after ^');
        e = parseInt(s.slice(i, k), 10);
        i = k;
        if (br) { if (s[i] !== '}') return fail('missing } in the exponent'); i++; }
      }
      e *= dir; dir = 1; sawAnything = true;
      if (name === 't') tHalves += 2 * e;
      else if (name === 'q') tHalves += 2 * e * qsign;
      else if (name === 'x') {
        if (!(idx >= 1 && idx <= n)) return fail('x' + (idx === null ? '' : idx) +
          ' is out of range (1…' + n + ')');
        vars.push({ kind: 'x', idx: idx, e: e });
      } else if (name === 'y') {
        if (!(idx >= 1 && idx <= N)) return fail('y' + (idx === null ? '' : idx) +
          ' is out of range (1…' + N + ')');
        vars.push({ kind: 'y', idx: idx, e: e });
      } else {
        if (RESERVED[name]) return fail('“' + name + '” is reserved');
        if (name.length > 3) return fail('“' + name + '” is not a variable name');
        const full = name + (idx === null ? '' : idx);
        if (extras.indexOf(full) < 0) extras.push(full);
        vars.push({ kind: 'p', name: full, e: e });
      }
      continue;
    }
    return fail('cannot read “' + s.slice(i) + '”');
  }
  if (!sawAnything) return fail('the right-hand side is empty');
  if (isZero) return { zero: true };
  return { coeff: sign * coeff, tHalves: tHalves, vars: vars };
}

/**
 * Parse a block of assignments.
 * Returns { subs, errors, extras }.
 */
function parseSubstitutions(text, n, N, qsign) {
  const errors = [], extras = [], subs = [];
  const seen = {};
  const lines = String(text).split(/[\n;]+/);
  lines.forEach((raw, li) => {
    const line = raw.replace(/#.*$/, '').trim();
    if (!line) return;
    const where = 'line ' + (li + 1);
    const eq = line.indexOf('=');
    if (eq < 0) { errors.push(where + ': expected something of the form  x1 = q^-1 y2'); return; }
    const lhs = line.slice(0, eq).trim().replace(/[_\s]/g, '');
    const rhs = line.slice(eq + 1);
    let kind = null, idx = null;
    if (lhs === 't') kind = 't';
    else if (lhs === 'q') {
      errors.push(where + ': substitute for t, not q (q is only a way of writing t)');
      return;
    } else if (/^x[0-9]+$/.test(lhs)) {
      kind = 'x'; idx = parseInt(lhs.slice(1), 10);
      if (!(idx >= 1 && idx <= n)) { errors.push(where + ': x' + idx + ' is out of range (1…' + n + ')'); return; }
    } else if (/^y[0-9]+$/.test(lhs)) {
      kind = 'y'; idx = parseInt(lhs.slice(1), 10);
      if (!(idx >= 1 && idx <= N)) { errors.push(where + ': y' + idx + ' is out of range (1…' + N + ')'); return; }
    } else {
      errors.push(where + ': the left-hand side must be t, x1…x' + n + ' or y1…y' + N);
      return;
    }
    const key = kind + (idx || '');
    if (seen[key]) { errors.push(where + ': ' + lhs + ' is assigned twice'); return; }
    seen[key] = 1;
    const m = scanMonomial(rhs, n, N, qsign, errors, where, extras);
    if (!m) return;
    subs.push(Object.assign({ lhsKind: kind, lhsIdx: idx, text: line }, m));
  });
  return { subs: subs, errors: errors, extras: extras };
}

/** Turn parsed assignments into a substitution array for the given ring. */
function materialiseSubst(ring, subs) {
  const sp = identitySubst(ring);
  for (const s of subs) {
    const slot = s.lhsKind === 't' ? 0
      : (s.lhsKind === 'x' ? ring.xi(s.lhsIdx) : ring.yj(s.lhsIdx));
    if (s.zero) { sp[slot] = { zero: true }; continue; }
    const e = new Array(ring.nv).fill(0);
    e[0] = s.tHalves || 0;
    for (const v of s.vars) {
      if (v.kind === 'x') e[ring.xi(v.idx)] += v.e;
      else if (v.kind === 'y') e[ring.yj(v.idx)] += v.e;
      else e[ring.pk(v.name)] += v.e;
    }
    sp[slot] = { coeff: BigInt(s.coeff), exps: e };
  }
  return sp;
}

/** A readable rendering of one assignment, for the interface. */
function substHtml(s, tDisplay) {
  const lhs = s.lhsKind === 't' ? '<i>t</i>'
    : '<i>' + s.lhsKind + '</i><sub>' + s.lhsIdx + '</sub>';
  if (s.zero) return lhs + ' = 0';
  const bits = [];
  if (s.coeff === -1) bits.push('−');
  else if (s.coeff !== 1) bits.push(String(s.coeff));
  if (s.tHalves) bits.push(tParamHtml(s.tHalves, tDisplay));
  for (const v of s.vars) {
    const nm = v.kind === 'p' ? '<i>' + v.name + '</i>'
      : '<i>' + v.kind + '</i><sub>' + v.idx + '</sub>';
    bits.push(v.e === 1 ? nm : nm + '<sup>' + v.e + '</sup>');
  }
  return lhs + ' = ' + (bits.length ? bits.join('') : '1');
}

/* ------------------------------------------------------------------------
   The objects of the paper, each expressed as
        (boundary data, weight family, specialisation, normalising factor)
   so that the viewer always shows an honest partition function and then says
   what the paper calls it.

   Numbering below is that of arXiv:2509.17312v1, collected in one place so it
   cannot drift.
   ------------------------------------------------------------------------ */

const PAPER = {
  figWhittaker: '1',   // Whittaker Boltzmann weights
  figYBE: '2',         // the Yang-Baxter configurations
  figR: '3',           // the R-matrix
  figK: '4',           // K-theoretic weights
  figState: '6',       // the characteristic state
  figDual: '8',        // the dual rectangular weights
  figRPoly: '10',      // weights of the restricted model for r_{u,v}
  figBMN: '11',        // the colour-blind (Bump-McNamara-Nakasuji) weights
  figPipe: '12',       // the t = 0 weights / pipe dreams

  defState: '3.2', remPaths: '3.3', thmYBE: '3.7',
  defBoundary: '4.1', exPartFun: '4.2', propBase: '4.4', propRec: '4.5',
  thmZ: '4.6', propSpecRec: '4.7', propVanish: '4.8', remComposition: '4.10',
  defMotivicLoc: '5.1', defMotivic: '5.3', propMClift: '5.4',
  thmMCdual: '5.7', propMCrel: '5.8', propDual: '5.9', corMC: '5.10',
  defStabLoc: '6.2', defStab: '6.3', propStabOp: '6.6', thmStab: '6.7',
  defInterp: '6.8', propInterp: '6.9',
  thmBN: '7.1', thmDenom: '7.3', propTheta: '7.9', propZTheta: '7.11', corR: '7.12',
  propOmegaZ: '8.2', thmFactorial: '8.5', lemMerging: '8.6',
  propZbar: '8.8', corGroth: '8.9', corPipe: '8.10'
};

const PRESETS = [
  { id: 'Z',        group: 'Partition function', label: 'Z  —  K-theoretic weights' },
  { id: 'Omega',    group: 'Partition function', label: 'Ω  —  Whittaker weights' },
  { id: 'Ztilde',   group: 'Partition function', label: 'Z̃  —  dual weights' },

  { id: 'MCvX',     group: 'Motivic Chern classes', label: 'MCᵛ(X(w)°)' },
  { id: 'MCvY',     group: 'Motivic Chern classes', label: 'MCᵛ(Y(w)°)' },
  { id: 'MCX',      group: 'Motivic Chern classes', label: 'MC(X(w)°)' },
  { id: 'MCY',      group: 'Motivic Chern classes', label: 'MC(Y(w)°)' },

  { id: 'stabm',    group: 'Stable envelopes', label: 'stab_-(w)' },
  { id: 'stabp',    group: 'Stable envelopes', label: 'stab_+(w)' },
  { id: 'stabu',    group: 'Stable envelopes', label: 'stab_u(w)  —  interpolated' },

  { id: 'rpoly',    group: 'Hecke algebra', label: 'r(u,v)  —  Bump–Nakasuji' },

  { id: 'iwahori',  group: 'Special cases', label: 'Iwahori Whittaker  Ω(z; 0)' },
  { id: 'factorial',group: 'Special cases', label: 'Factorial Schur  s(x|y)' },
  { id: 'groth',    group: 'Special cases', label: '𝔊(w)  —  double Grothendieck, t = 0' }
];

const PRESET_BY_ID = {};
PRESETS.forEach(p => PRESET_BY_ID[p.id] = p);

/**
 * Which inputs does each preset use, and which specialisations has it already
 * spent?  `xSpent` means the x variables are already substituted, so offering
 * the user another x-substitution would be meaningless.
 */
function presetInputs(id) {
  switch (id) {
    case 'Z': case 'Omega': return { lambda: true, sigma: true, w: true, N: true };
    case 'Ztilde': return { sigma: true, w: true };
    case 'MCvX': case 'MCvY': case 'MCX': case 'MCY': return { w: true };
    case 'stabm': case 'stabp': return { w: true };
    case 'stabu': return { w: true, u: true };
    case 'rpoly': return { u: true, v: true, xSpent: true };
    case 'iwahori': return { lambda: true, sigma: true, w: true, N: true, ySpent: true };
    case 'factorial': return { lambda0: true, sigma: true };
    case 'groth': return { w: true, tSpent: true };
    default: return {};
  }
}

/* ---------------------------------------------------------------- helpers */

function boxPartition(n) { const b = []; for (let k = n; k >= 1; k--) b.push(k); return b; }

function subRelabelY(ring, perm, invert) {
  const sp = identitySubst(ring);
  for (let j = 1; j <= ring.N; j++) {
    const e = new Array(ring.nv).fill(0);
    e[ring.yj(j <= perm.length ? perm[j - 1] : j)] = invert ? -1 : 1;
    sp[ring.yj(j)] = { coeff: 1n, exps: e };
  }
  return sp;
}
function subInvertX(ring) {
  const sp = identitySubst(ring);
  for (let i = 1; i <= ring.n; i++) {
    const e = new Array(ring.nv).fill(0);
    e[ring.xi(i)] = -1;
    sp[ring.xi(i)] = { coeff: 1n, exps: e };
  }
  return sp;
}
function subInvertY(ring) {
  const sp = identitySubst(ring);
  for (let j = 1; j <= ring.N; j++) {
    const e = new Array(ring.nv).fill(0);
    e[ring.yj(j)] = -1;
    sp[ring.yj(j)] = { coeff: 1n, exps: e };
  }
  return sp;
}
function subRestrict(ring, u) {
  const sp = identitySubst(ring);
  for (let i = 1; i <= ring.n; i++) {
    const e = new Array(ring.nv).fill(0);
    e[ring.yj(u[i - 1])] = 1;
    sp[ring.xi(i)] = { coeff: 1n, exps: e };
  }
  return sp;
}
function subZero(ring, slots) {
  const sp = identitySubst(ring);
  for (const s of slots) sp[s] = { zero: true };
  return sp;
}
/** Compose two substitutions: first a, then b. */
function subCompose(ring, a, b) {
  const sp = identitySubst(ring);
  for (let i = 0; i < ring.nv; i++) {
    const s = a[i];
    if (!s) { sp[i] = b[i]; continue; }
    if (s.zero) { sp[i] = s; continue; }
    let coeff = s.coeff;
    const e = new Array(ring.nv).fill(0);
    let dead = false;
    for (let j = 0; j < ring.nv; j++) {
      const ej = s.exps[j];
      if (!ej) continue;
      const t = b[j];
      if (!t) { e[j] += ej; continue; }
      if (t.zero) { dead = true; break; }
      if (t.coeff !== 1n) coeff *= t.coeff ** BigInt(ej < 0 ? -ej : ej);
      for (let k = 0; k < ring.nv; k++) if (t.exps[k]) e[k] += t.exps[k] * ej;
    }
    sp[i] = dead ? { zero: true } : { coeff: coeff, exps: e };
  }
  return sp;
}

function monoPoly(ring, sign, tHalves, xExps, yExps) {
  const e = new Array(ring.nv).fill(0);
  e[0] = tHalves;
  if (xExps) for (let i = 1; i <= ring.n; i++) if (xExps[i - 1]) e[ring.xi(i)] = xExps[i - 1];
  if (yExps) for (let j = 1; j <= ring.N; j++) if (yExps[j - 1]) e[ring.yj(j)] = yExps[j - 1];
  return P_mono(ring, sign, e);
}

/** r(x_v ; y_u) = (-1)^{l(w_0)} prod_i x_{v(i)}^{n-i} y_{u(i)}^{-(n-i)} */
function rFactor(ring, n, v, u) {
  const xE = new Array(ring.n).fill(0), yE = new Array(ring.N).fill(0);
  for (let i = 1; i <= n; i++) { xE[v[i - 1] - 1] += n - i; yE[u[i - 1] - 1] -= n - i; }
  return monoPoly(ring, permLen(permW0(n)) % 2 ? -1 : 1, 0, xE, yE);
}

/** phi_w(y) of Section 7, as a list of factors. */
function phiFactors(ring, w, n) {
  const wi = permInv(w);
  const out = [];
  for (let i = 1; i <= n; i++) {
    for (let j = i + 1; j <= n; j++) {
      const e = new Array(ring.nv).fill(0);
      e[ring.yj(j)] = 1; e[ring.yj(i)] = -1;             // y^{-alpha}
      const ym = P_mono(ring, 1, e);
      if (wi[i - 1] < wi[j - 1]) {
        const te = e.slice(); te[0] = 2;
        out.push({ poly: P_sub(P_mono(ring, 1, te), P_const(ring, 1)),
                   tex: 'q y<sub>' + j + '</sub>/y<sub>' + i + '</sub> − 1',
                   kind: 'q', i: i, j: j });
      } else {
        out.push({ poly: P_sub(P_const(ring, 1), ym),
                   tex: '1 − y<sub>' + j + '</sub>/y<sub>' + i + '</sub>',
                   kind: 'one', i: i, j: j });
      }
    }
  }
  return out;
}

/** S(u,v) = { alpha in Phi^+ : u <= v r_alpha < v }, for the denominator theorem. */
function SetSuv(u, v, n) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    for (let j = i + 1; j <= n; j++) {
      const ra = permId(n); ra[i - 1] = j; ra[j - 1] = i;
      const vr = permMul(v, ra);
      if (permLen(vr) < permLen(v) && bruhatLeq(u, vr)) out.push([i, j]);
    }
  }
  return out;
}

/* ------------------------------------------------------------------- spec */

function buildSpec(inp) {
  const n = inp.n;
  const e = permId(n), w0 = permW0(n), box = boxPartition(n);
  const L = permLen;
  const need = presetInputs(inp.preset);

  let N = inp.N, lam = inp.lambda, sigma = inp.sigma, w = inp.w;
  let family = 'ktheoretic';
  let tDisplay = 't', sumOverW = false, denomPerm = null;
  let title = '', sub = '', ref = '', latticeName = '', factorName = '', note = '';
  const subSteps = [];
  const factors = [];

  switch (inp.preset) {
    case 'Z':
      title = '<i>Z</i><sup>λ</sup><sub>σ,w</sub>(<b>x</b>;<b>y</b>)';
      sub = '';
      latticeName = title;
      break;
    case 'Omega':
      family = 'whittaker';
      title = 'Ω<sup>λ</sup><sub>σ,w</sub>(<b>x</b>;<b>y</b>)';
      sub = '';
      latticeName = title;
      break;
    case 'Ztilde':
      family = 'dual'; lam = box; N = n;
      title = '<i>Z̃</i><sup>□</sup><sub>σ,w</sub>(<b>x</b>;<b>y</b>)';
      sub = '';
      latticeName = title;
      break;

    case 'MCvX':
      lam = box; N = n; sigma = e; w = permMul(w0, inp.w);
      title = 'MC<sup>∨</sup>(X(w)°)';
      sub = 'dual motivic Chern class of the Schubert cell';
      ref = 'Theorem ' + PAPER.thmMCdual;
      latticeName = '<i>Z</i><sup>□</sup><sub>1,w₀w</sub>(<b>x</b>; <b>y</b><sub>w₀</sub>)';
      factorName = '(−t)<sup>−ℓ(w)</sup>';
      subSteps.push({ kind: 'relabelY', perm: w0 });
      factors.push({ sign: (L(inp.w) % 2 ? -1 : 1), tHalves: -2 * L(inp.w) });
      break;
    case 'MCvY':
      lam = box; N = n; sigma = e; w = inp.w;
      title = 'MC<sup>∨</sup>(Y(w)°)';
      sub = 'dual motivic Chern class of the opposite cell';
      ref = 'Theorem ' + PAPER.thmMCdual;
      latticeName = '<i>Z</i><sup>□</sup><sub>1,w</sub>(<b>x</b>; <b>y</b>)';
      factorName = '(−t)<sup>−ℓ(w⁻¹w₀)</sup>';
      { const k = L(permMul(permInv(inp.w), w0));
        factors.push({ sign: (k % 2 ? -1 : 1), tHalves: -2 * k }); }
      break;
    case 'MCX':
      family = 'dual'; lam = box; N = n; sigma = e; w = permMul(w0, inp.w);
      title = 'MC(X(w)°)';
      sub = 'motivic Chern class of the Schubert cell';
      ref = 'Corollary ' + PAPER.corMC;
      latticeName = '<i>Z̃</i><sup>□</sup><sub>1,w₀w</sub>(<b>x</b>; <b>y</b><sub>w₀</sub>)';
      factorName = '(−1)<sup>ℓ(w₀)</sup>';
      subSteps.push({ kind: 'relabelY', perm: w0 });
      factors.push({ sign: (L(w0) % 2 ? -1 : 1), tHalves: 0 });
      break;
    case 'MCY':
      family = 'dual'; lam = box; N = n; sigma = e; w = inp.w;
      title = 'MC(Y(w)°)';
      sub = 'motivic Chern class of the opposite cell';
      ref = 'Corollary ' + PAPER.corMC;
      latticeName = '<i>Z̃</i><sup>□</sup><sub>1,w</sub>(<b>x</b>; <b>y</b>)';
      factorName = '(−1)<sup>ℓ(w₀)</sup>';
      factors.push({ sign: (L(w0) % 2 ? -1 : 1), tHalves: 0 });
      break;

    case 'stabm':
      lam = box; N = n; sigma = e; w = inp.w; tDisplay = 'q=1/t';
      title = 'stab<sub>−</sub>(w)';
      sub = 'K-theoretic stable envelope, negative chamber';
      ref = 'Theorem ' + PAPER.thmStab;
      latticeName = '<i>Z</i><sup>□</sup><sub>1,w</sub>(<b>x</b><sup>−1</sup>; <b>y</b><sup>−1</sup>)';
      factorName = '(−1)<sup>ℓ(w₀)</sup> q<sup>ℓ(w₀)−ℓ(w)/2</sup> r(<b>x</b><sub>w₀</sub>; <b>y</b>)';
      subSteps.push({ kind: 'invertXY' });
      factors.push({ rfactor: [w0, e] });
      factors.push({ sign: (L(w0) % 2 ? -1 : 1), tHalves: -(2 * L(w0) - L(inp.w)) });
      break;
    case 'stabp':
      lam = box; N = n; sigma = w0; w = inp.w; tDisplay = 'q=1/t';
      title = 'stab<sub>+</sub>(w)';
      sub = 'K-theoretic stable envelope, positive chamber';
      ref = 'Theorem ' + PAPER.thmStab;
      latticeName = '<i>Z</i><sup>□</sup><sub>w₀,w</sub>(<b>x</b><sup>−1</sup>; ' +
        '<b>y</b><sub>w₀</sub><sup>−1</sup>)';
      factorName = 'q<sup>ℓ(w₀)−ℓ(w)/2</sup> r(<b>x</b>; <b>y</b><sub>w₀</sub>)';
      subSteps.push({ kind: 'invertX' });
      subSteps.push({ kind: 'relabelYinv', perm: w0 });
      factors.push({ rfactor: [e, w0] });
      factors.push({ sign: 1, tHalves: -(2 * L(w0) - L(inp.w)) });
      break;
    case 'stabu': {
      lam = box; N = n; sigma = inp.u; w = inp.w; tDisplay = 'q=1/t';
      const uw0 = permMul(inp.u, w0);
      title = 'stab<sub>u</sub>(w)';
      sub = 'interpolated stable envelope; stab<sub>e</sub> = stab<sub>−</sub> and ' +
        'stab<sub>w₀</sub> = stab<sub>+</sub>';
      ref = 'Definition ' + PAPER.defInterp;
      latticeName = '<i>Z</i><sup>□</sup><sub>u,w</sub>(<b>x</b><sup>−1</sup>; ' +
        '(<b>y</b><sub>u</sub>)<sup>−1</sup>)';
      factorName = '(−1)<sup>ℓ(uw₀)</sup> q<sup>ℓ(w₀)−ℓ(w)/2</sup> ' +
        'r(<b>x</b><sub>(uw₀)⁻¹</sub>; <b>y</b><sub>u</sub>)';
      subSteps.push({ kind: 'invertX' });
      subSteps.push({ kind: 'relabelYinv', perm: inp.u });
      factors.push({ rfactor: [permInv(uw0), inp.u] });
      factors.push({ sign: (L(uw0) % 2 ? -1 : 1), tHalves: -(2 * L(w0) - L(inp.w)) });
      break;
    }

    case 'rpoly':
      lam = box; N = n; sigma = e; w = permInv(inp.u); tDisplay = 'q=t';
      title = '<i>r</i><sub>u,v</sub>(<b>y</b>)';
      sub = 'deformation of the Kazhdan–Lusztig R-polynomial';
      ref = 'Corollary ' + PAPER.corR;
      latticeName = '<i>Z</i><sup>□</sup><sub>1,u⁻¹</sub>|<sub>v⁻¹</sub> ' +
        '= [Θ<sub>u</sub>]<sub>v</sub>';
      factorName = 'φ<sub>v⁻¹</sub><sup>−1</sup>';
      subSteps.push({ kind: 'restrict', perm: permInv(inp.v) });
      denomPerm = permInv(inp.v);
      break;

    case 'iwahori':
      family = 'whittaker';
      title = 'Ω<sup>λ</sup><sub>σ,w</sub>(<b>z</b>; 0)';
      sub = 'value of an Iwahori Whittaker function';
      ref = 'Section 8.1';
      latticeName = 'Ω<sup>λ</sup><sub>σ,w</sub> with every <i>y<sub>j</sub></i> = 0';
      subSteps.push({ kind: 'setYZero' });
      break;

    case 'factorial':
      family = 'whittaker'; sumOverW = true;
      lam = inp.lambda0.map((a, i) => a + box[i]);
      N = lam[0];
      title = '(∏<sub>i&lt;j</sub>(x<sub>i</sub> − t x<sub>j</sub>)) · s<sub>λ</sub>(x|y)';
      sub = 'the sum over all w ∈ S<sub>n</sub>; independent of σ';
      ref = 'Theorem ' + PAPER.thmFactorial + '';
      latticeName = 'Σ<sub>w</sub> Ω<sup>λ+□</sup><sub>σ,w</sub>(<b>x</b>;<b>y</b>)';
      break;

    case 'groth':
      lam = box; N = n; sigma = e; w = inp.w;
      title = '𝔊<sub>w</sub>(<b>x</b>;<b>y</b>)';
      sub = 'double Grothendieck polynomial; the surviving states are the reduced pipe dreams';
      ref = 'Corollaries ' + PAPER.corGroth + ' and ' + PAPER.corPipe;
      latticeName = '<i>Z</i><sup>□</sup><sub>1,w</sub>(<b>x</b>;<b>y</b>) at t = 0';
      factorName = '(−1)<sup>ℓ(w⁻¹w₀)</sup>';
      subSteps.push({ kind: 'setTZero' });
      factors.push({ sign: (permLen(permMul(permInv(inp.w), w0)) % 2 ? -1 : 1), tHalves: 0 });
      break;
  }

  /* ---- the user's own specialisation, on top --------------------------- */
  const us = inp.spec || {};
  const qsign = tDisplay === 'q=1/t' ? -1 : 1;      // t^k written as q^k when q = 1/t
  let userSubs = [], userErrs = [], extras = [];
  const Nmax = Math.max(N, n);
  const level = us.level || 'basic';
  const tsym = tDisplay === 't' ? 't' : 'q';

  if (level !== 'advanced') {
    if (!need.xSpent) {
      const xm = us.xmap || [];
      for (let i = 1; i <= n; i++) {
        const m = xm[i - 1];
        if (m && m.j) {
          userSubs.push({ lhsKind: 'x', lhsIdx: i, coeff: 1,
            tHalves: 2 * (m.k || 0) * qsign,
            vars: [{ kind: 'y', idx: m.j, e: 1 }],
            text: 'x' + i + ' = ' + (m.k ? tsym + '^' + m.k + ' ' : '') + 'y' + m.j });
        }
      }
    }
    if (!need.tSpent && us.tZero) userSubs.push({ lhsKind: 't', zero: true, text: 't = 0' });
    if (!need.ySpent && us.yZero) {
      for (let j = 1; j <= Nmax; j++) {
        userSubs.push({ lhsKind: 'y', lhsIdx: j, zero: true, text: 'y' + j + ' = 0' });
      }
    }
  } else if (us.advanced) {
    const parsed = parseSubstitutions(us.advanced, n, Nmax, qsign);
    userErrs = parsed.errors;
    extras = parsed.extras;
    userSubs = parsed.subs;
  }

  const ring = makeRing(n, Nmax, extras);
  const r = n;
  const bd = boundaryFromData(n, N, r, sigma, w, lam);

  /* ---- assemble the specialisation ------------------------------------- */
  let subst = identitySubst(ring);
  for (const st of subSteps) {
    let s;
    switch (st.kind) {
      case 'relabelY': s = subRelabelY(ring, st.perm, false); break;
      case 'relabelYinv': s = subRelabelY(ring, st.perm, true); break;
      case 'invertX': s = subInvertX(ring); break;
      case 'invertXY': s = subCompose(ring, subInvertX(ring), subInvertY(ring)); break;
      case 'restrict': s = subRestrict(ring, st.perm); break;
      case 'setTZero': s = subZero(ring, [0]); break;
      case 'setYZero': {
        const sl = []; for (let j = 1; j <= ring.N; j++) sl.push(ring.yj(j));
        s = subZero(ring, sl); break;
      }
    }
    subst = subCompose(ring, subst, s);
  }
  const userSubst = materialiseSubst(ring, userSubs);
  const hasUserSubst = userSubs.length > 0;
  const presetSubst = subst;
  if (hasUserSubst) subst = subCompose(ring, subst, userSubst);

  /* ---- the normalising factor ------------------------------------------ */
  let factorPoly = P_const(ring, 1);
  for (const f of factors) {
    if (f.rfactor) factorPoly = P_mul(factorPoly, rFactor(ring, n, f.rfactor[0], f.rfactor[1]));
    else {
      const ee = new Array(ring.nv).fill(0);
      ee[0] = f.tHalves || 0;
      factorPoly = P_mul(factorPoly, P_mono(ring, f.sign, ee));
    }
  }

  return {
    ring: ring, bd: bd, family: family, n: n, N: N, r: r,
    lambda: lam, sigma: sigma, w: w,
    subst: subst, presetSubst: presetSubst, userSubs: userSubs,
    hasUserSubst: hasUserSubst,
    hasSubst: subSteps.length > 0 || hasUserSubst,
    factorPoly: factorPoly, hasFactor: factors.length > 0,
    title: title, sub: sub, ref: ref, note: note,
    latticeName: latticeName, factorName: factorName,
    sumOverW: sumOverW, tDisplay: tDisplay, denomPerm: denomPerm,
    preset: inp.preset, userErrs: userErrs, extras: extras
  };
}

/**
 * Remark 4.10.  If every x_i has been set to some y_{mu(i)}
 * with the mu_i distinct and no extra power of t, the restriction is at a
 * composition mu; write mu_i = nu_{u(i)} with nu the decreasing rearrangement.
 * Then Z^lambda_{sigma,w}|_{nu u} = 0 unless nu = lambda and u <= w_0 sigma^-1 w
 * (assuming |nu| <= |lambda|), and for u = w_0 sigma^-1 w there is a closed form.
 */
function compositionInfo(spec, inp) {
  const need = presetInputs(inp.preset);
  if (need.xSpent || !inp.spec || (inp.spec.level || 'basic') === 'advanced') return null;
  const n = spec.n;
  const xm = inp.spec.xmap || [];
  const mu = [];
  for (let i = 0; i < n; i++) {
    const m = xm[i];
    if (!m || !m.j || (m.k || 0) !== 0) return null;
    mu.push(m.j);
  }
  if (new Set(mu).size !== n) return null;
  const nu = mu.slice().sort((a, b) => b - a);
  const u = mu.map(v => nu.indexOf(v) + 1);
  const target = permMul(permW0(n), permMul(permInv(spec.sigma), spec.w));
  const sizeOk = nu.reduce((a, b) => a + b, 0) <= spec.lambda.reduce((a, b) => a + b, 0);
  const nuIsLambda = nu.every((v, i) => v === spec.lambda[i]);
  const uLeq = bruhatLeq(u, target);
  return { mu: mu, nu: nu, u: u, target: target, sizeOk: sizeOk,
           nuIsLambda: nuIsLambda, uLeq: uLeq,
           mustVanish: sizeOk && !(nuIsLambda && uLeq),
           diagonal: nuIsLambda && u.every((v, i) => v === target[i]) };
}

/** Apply just the specialisation. */
function applySubst(spec, p) { return P_subst(p, spec.subst); }

/** Specialisation followed by the normalising factor. */
function applyPost(spec, p) {
  return P_mul(P_subst(p, spec.subst), spec.factorPoly);
}

/* ------------------------------------------------------------------------
   Factoring a partition function.

   These polynomials are, when they factor at all, products of a monomial, an
   integer, and binomials -- 1 - x_i/y_j, t - 1, x_i - t x_j, and their like.
   So the search is deliberately narrow: pull out the content and the monomial
   gcd, then look for binomial factors and divide them out, repeatedly.

   The search is exhaustive over binomials in this sense: any binomial factor
   alpha + beta z^R of P must have z^R equal to the ratio of two monomials of P,
   because after removing the monomial gcd the lowest term of P is the product
   of the lowest terms of its factors.  So the candidates are read off P's own
   terms.  What this will NOT find is an irreducible factor with three or more
   terms; anything of that kind is left in the cofactor and reported as such,
   never silently dropped.

   Every factorisation is multiplied back out and compared with the input
   before it is returned, so a wrong one cannot be displayed.
   ------------------------------------------------------------------------ */

function gcdBig(a, b) {
  a = a < 0n ? -a : a; b = b < 0n ? -b : b;
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}
function gcdInt(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a;
}

/** the divisors of a positive integer, small ones first */
function divisorsOf(n) {
  const out = [];
  for (let d = 1; d * d <= n; d++) {
    if (n % d === 0) { out.push(d); if (d !== n / d) out.push(n / d); }
  }
  return out.sort((a, b) => a - b);
}

/**
 * factorise(p, opts) with opts = { deadline, maxTerms }.
 * Returns
 *   { content, mono, factors: [{poly, exp}], rest, complete, timedOut, ms }
 * where p = content * z^mono * prod factors^exp * rest, and `complete` says
 * rest is 1.
 */
function factorise(p, opts) {
  opts = opts || {};
  const t0 = Date.now();
  const deadline = opts.deadline === undefined ? t0 + 2000 : opts.deadline;
  const ring = p.ring, nv = ring.nv;
  const zero = new Array(nv).fill(0);

  if (P_isZero(p)) {
    return { content: 0n, mono: zero, factors: [], rest: null, complete: true,
             timedOut: false, ms: 0 };
  }

  // content and monomial gcd
  let content = P_content(p);
  const mono = P_monomialGcd(p);
  let cur = P_divMono(p, content, mono);
  if (!cur) return null;
  // keep the sign so that the first term as displayed is positive
  const first = P_termList(cur)[0];
  if (first && first.c < 0n) { content = -content; cur = P_scale(cur, -1); }

  const factors = [];
  const pushFactor = f => {
    for (const g of factors) if (P_equals(g.poly, f)) { g.exp++; return; }
    factors.push({ poly: f, exp: 1 });
  };

  let timedOut = false;
  const maxTerms = opts.maxTerms || 4000;
  // t is stored with a doubled exponent so that q^{1/2} is exact.  If the input
  // has no half-integer power of t, do not introduce one: (1-t) = (1-t^{1/2})
  // (1+t^{1/2}) is a true factorisation in this ring but not one anybody wants.
  let allowHalfT = false;
  for (const k of p.terms.keys()) if (expOf(k)[0] % 2 !== 0) { allowHalfT = true; break; }

  for (;;) {
    if (P_numTerms(cur) <= 1) break;                 // a monomial: nothing left
    if (P_numTerms(cur) > maxTerms) break;
    if (Date.now() > deadline) { timedOut = true; break; }
    const found = findBinomialFactor(cur, deadline, allowHalfT);
    if (found === 'timeout') { timedOut = true; break; }
    if (!found) break;
    pushFactor(found.factor);
    cur = found.quotient;
  }

  // whatever is left
  let rest = null;
  if (P_numTerms(cur) === 1) {
    // a leftover monomial folds into the content and the monomial part
    const tm = P_termList(cur)[0];
    content *= tm.c;
    for (let i = 0; i < nv; i++) mono[i] += tm.e[i];
  } else if (!P_equals(cur, P_const(ring, 1))) {
    rest = cur;
  }

  const res = { content: content, mono: mono, factors: factors, rest: rest,
                complete: rest === null, timedOut: timedOut,
                ms: Date.now() - t0 };

  // never return a factorisation without checking it
  let back = P_mono(ring, 1, mono);
  back.terms.set(keyOf(mono), content);
  for (const f of factors) for (let i = 0; i < f.exp; i++) back = P_mul(back, f.poly);
  if (rest) back = P_mul(back, rest);
  if (!P_equals(back, p)) return null;
  return res;
}

/**
 * Look for one binomial factor of `q` (which has unit content and no monomial
 * factor).  Returns { factor, quotient } or null, or the string 'timeout'.
 */
function findBinomialFactor(q, deadline, allowHalfT) {
  const ring = q.ring, nv = ring.nv;
  const terms = P_termList(q);
  const base = terms[0];
  const seen = new Set();
  const cands = [];

  for (let idx = 1; idx < terms.length; idx++) {
    const other = terms[idx];
    const R0 = new Array(nv);
    let g = 0;
    for (let i = 0; i < nv; i++) { R0[i] = other.e[i] - base.e[i]; g = gcdInt(g, R0[i]); }
    if (g === 0) continue;
    for (const d of divisorsOf(g)) {
      const R = R0.map(v => v / d);
      if (!allowHalfT && R[0] % 2 !== 0) continue;
      const key = R.join(',');
      if (seen.has(key)) continue;
      seen.add(key);
      const pairs = [[1n, 1n], [1n, -1n]];
      if (d === 1) {
        const cg = gcdBig(base.c, other.c);
        if (cg !== 0n) {
          const a = base.c / cg, b = other.c / cg;
          if (!(a === 1n && (b === 1n || b === -1n))) pairs.push([a, b]);
        }
      }
      let wgt = 0;
      for (let i = 0; i < nv; i++) wgt += Math.abs(R[i]);
      cands.push({ R: R, pairs: pairs, w: wgt });
    }
  }
  // the factors that occur in practice are things like 1 - x_i/y_j, so try the
  // shortest exponent vectors first; this finds them long before the sweep ends
  cands.sort((a, b) => a.w - b.w);

  for (const c of cands) {
    if (Date.now() > deadline) return 'timeout';
    for (const ab of c.pairs) {
      const quo = P_divBinomial(q, ab[0], ab[1], c.R);
      if (!quo || P_isZero(quo)) continue;
      const fe = new Array(nv).fill(0);
      const f = P_mono(ring, 1, fe);
      f.terms.set(keyOf(fe), ab[0]);
      const rk = keyOf(c.R);
      f.terms.set(rk, (f.terms.get(rk) || 0n) + ab[1]);
      if (f.terms.get(rk) === 0n) continue;
      return { factor: f, quotient: quo };
    }
  }
  return null;
}

/** A factorisation as HTML. */
function factorHtml(fac, ring, opts) {
  opts = opts || {};
  const bits = [];
  const mag = fac.content < 0n ? -fac.content : fac.content;
  const monoIsOne = fac.mono.every(v => v === 0);
  if (mag !== 1n || (monoIsOne && !fac.factors.length && !fac.rest)) bits.push(mag.toString());
  if (!monoIsOne) {
    const m = P_mono(ring, 1, fac.mono);
    bits.push(polyHtml(m, opts));
  }
  const sorted = fac.factors.slice().sort((a, b) =>
    P_numTerms(a.poly) - P_numTerms(b.poly) ||
    (polyHtml(a.poly, opts) < polyHtml(b.poly, opts) ? -1 : 1));
  for (const f of sorted) {
    const h = polyHtml(f.poly, opts);
    const base = P_numTerms(f.poly) > 1 ? '(' + h + ')' : h;
    bits.push(f.exp === 1 ? base : base + '<sup>' + f.exp + '</sup>');
  }
  if (fac.rest) bits.push('(' + polyHtml(fac.rest, opts) + ')');
  const body = bits.length ? bits.join(' · ') : '1';
  return (fac.content < 0n ? '−' : '') + body;
}

/** The number of terms in the longest piece of a factorisation -- what the
 *  "show all" control has to act on, since that is the only long piece. */
function facMaxTerms(fac) {
  let m = 1;
  for (const f of fac.factors) m = Math.max(m, P_numTerms(f.poly));
  if (fac.rest) m = Math.max(m, P_numTerms(fac.rest));
  return m;
}

/** Worth showing instead of the expansion?  Only if a real factor came out:
 *  pulling a monomial through a denominator makes things worse, not better. */
function factorIsUseful(fac) {
  return !!fac && fac.factors.length > 0;
}

/* ------------------------------------------------------------------------
   The computation, written so that it can run either inside a Web Worker or,
   if the browser refuses to start one from a file:// page, in the page under
   the same time limit.  Everything it returns is plain data.
   ------------------------------------------------------------------------ */

function polyToPlain(p) {
  const out = [];
  for (const [k, v] of p.terms) out.push([k, v.toString()]);
  return out;
}

function polyFromPlain(ring, plain) {
  const m = new Map();
  for (const [k, v] of plain) m.set(k, BigInt(v));
  return { ring: ring, terms: m };
}

function facToPlain(fac) {
  if (!fac) return null;
  return {
    content: fac.content.toString(), mono: fac.mono,
    factors: fac.factors.map(f => ({ terms: polyToPlain(f.poly), exp: f.exp })),
    rest: fac.rest ? polyToPlain(fac.rest) : null,
    complete: fac.complete, timedOut: fac.timedOut, ms: fac.ms,
    useful: factorIsUseful(fac)
  };
}

function facFromPlain(ring, f) {
  if (!f) return null;
  return {
    content: BigInt(f.content), mono: f.mono,
    factors: f.factors.map(g => ({ poly: polyFromPlain(ring, g.terms), exp: g.exp })),
    rest: f.rest ? polyFromPlain(ring, f.rest) : null,
    complete: f.complete, timedOut: f.timedOut, ms: f.ms, useful: f.useful
  };
}

/** A stand-alone factorisation job, for the “Factor” button. */
function runFactorJob(job) {
  const ring = makeRing(job.n, job.N, job.extras || []);
  const p = polyFromPlain(ring, job.terms);
  const fac = factorise(p, { deadline: Date.now() + (job.budgetMs || 10000) });
  return { ok: true, kind: 'factor', which: job.which, fac: facToPlain(fac) };
}

/**
 * `job` = { inp, timeLimitMs, storeLimit, mode, sampleSize }.
 * mode is 'auto', 'full' or 'random'.
 */
function runJob(job) {
  if (job.kind === 'factor') return runFactorJob(job);
  const t0 = Date.now();
  const spec = buildSpec(job.inp);
  const ring = spec.ring;
  const budget = job.timeLimitMs || 10000;
  const deadline = t0 + budget;
  const storeLimit = job.storeLimit || 4000;
  const sampleSize = job.sampleSize || 12;
  const autoLimit = job.autoLimit || 3000;
  let mode = job.mode || 'auto';

  if (spec.userErrs && spec.userErrs.length) {
    return { ok: false, specErrors: spec.userErrs };
  }

  const boundaries = spec.sumOverW
    ? permAll(spec.n).map(w => ({
        w: w, bd: boundaryFromData(spec.n, spec.N, spec.r, spec.sigma, w, spec.lambda) }))
    : [{ w: spec.w, bd: spec.bd }];

  let count = 0, searchTruncated = false, storeTruncated = false;
  let sampled = false;
  const states = [];

  if (mode === 'random') {
    sampled = true;
    for (const b of boundaries) {
      const k = Math.max(1, Math.round(sampleSize / boundaries.length));
      for (const st of sampleStates(b.bd, k, deadline)) states.push({ w: b.w, st: st });
    }
  } else {
    for (const b of boundaries) {
      const res = enumerateStates(b.bd, { limit: storeLimit, deadline: deadline });
      count += res.count;
      searchTruncated = searchTruncated || res.searchTruncated;
      storeTruncated = storeTruncated || res.storeTruncated;
      b.states = res.states;
      for (const st of res.states) states.push({ w: b.w, st: st });
    }
    if (mode === 'auto' && (searchTruncated || count > autoLimit)) {
      // too big to weight comfortably: show a handful of states instead
      mode = 'random';
      sampled = true;
      states.length = 0;
      for (const b of boundaries) {
        const k = Math.max(1, Math.round(sampleSize / boundaries.length));
        for (const st of sampleStates(b.bd, k, Date.now() + Math.max(1500, deadline - Date.now())))
          states.push({ w: b.w, st: st });
      }
    }
  }
  const tEnum = Date.now() - t0;

  /* ---- the partition function ----------------------------------------- */
  let zRaw = P_zero(ring), zTruncated = true, zDone = 0;
  if (!sampled && !searchTruncated && !storeTruncated) {
    zTruncated = false;
    for (const b of boundaries) {
      const r = partitionFunction(b.bd, b.states, ring, spec.family, { deadline: deadline });
      P_addInto(zRaw, r.poly);
      zDone += r.done;
      if (r.truncated) { zTruncated = true; break; }
    }
  }
  const tZ = Date.now() - t0 - tEnum;

  let z = null, zLattice = null, zErr = null;
  if (!zTruncated) {
    try {
      zLattice = applySubst(spec, zRaw);
      z = P_mul(zLattice, spec.factorPoly);
    } catch (err) { zErr = String(err.message || err); }
  }

  // a quick attempt at factoring, cheap enough to do on every run: the ground
  // states factor completely in a few milliseconds, and a polynomial that does
  // not factor is found out almost as fast
  const quick = job.quickFactorMs === undefined ? 700 : job.quickFactorMs;
  let facZ = null, facLattice = null;
  if (z && quick > 0) {
    facZ = facToPlain(factorise(z, { deadline: Date.now() + quick }));
    if (spec.hasFactor && zLattice) {
      facLattice = facToPlain(factorise(zLattice, { deadline: Date.now() + quick }));
    }
  }

  /* ---- Theorem 4.6, checked live -------------------------------------- */
  let demazure = 'skipped';
  if (!zTruncated && !spec.sumOverW &&
      permEq(maxCosetRep(spec.sigma, spec.lambda), spec.sigma)) {
    try {
      const dz = demazureZ(ring, spec.n, spec.sigma, spec.w, spec.lambda);
      if (dz === null) demazure = 'skipped';
      else if (spec.family === 'ktheoretic') {
        demazure = P_equals(zRaw, dz) ? 'ok' : 'FAILED';
      } else if (spec.family === 'whittaker') {
        let d2 = dz;
        for (let i = 1; i <= spec.n; i++) d2 = P_negateVar(d2, ring.xi(i));
        const e = new Array(ring.nv).fill(0);
        for (let j = 1; j <= spec.N; j++) e[ring.yj(j)] = spec.lambda.filter(a => a > j).length;
        demazure = P_equals(zRaw, P_mulMono(d2, 1, e)) ? 'ok' : 'FAILED';
      } else if (spec.family === 'dual') {
        const inv = identitySpec(ring);
        for (let i = 1; i <= spec.n; i++) inv[ring.xi(i)] = [ring.xi(i), -1];
        for (let j = 1; j <= ring.N; j++) inv[ring.yj(j)] = [ring.yj(j), -1];
        const e = new Array(ring.nv).fill(0);
        for (let i = 1; i <= spec.n; i++) {
          e[ring.xi(i)] = spec.n - i; e[ring.yj(i)] = -(spec.n - i);
        }
        demazure = P_equals(zRaw, P_mulMono(P_relabel(dz, inv), 1, e)) ? 'ok' : 'FAILED';
      }
    } catch (err) { demazure = 'skipped'; }
  }

  /* ---- the r-polynomial denominator, cancelled factor by factor -------- */
  let denom = null;
  if (spec.denomPerm && z) {
    const facs = phiFactors(ring, spec.denomPerm, spec.n);
    let num = z;
    const kept = [];
    for (const f of facs) {
      const q = divideByFactor(ring, num, f);
      if (q) num = q; else kept.push(f);
    }
    denom = {
      numer: polyToPlain(num),
      kept: kept.map(f => ({ tex: f.tex, i: f.i, j: f.j, kind: f.kind })),
      all: facs.map(f => ({ tex: f.tex, i: f.i, j: f.j, kind: f.kind }))
    };
  }

  return {
    ok: true,
    mode: mode, sampled: sampled,
    count: count,
    searchTruncated: searchTruncated,
    storeTruncated: storeTruncated,
    zTruncated: zTruncated,
    zDone: zDone,
    zErr: zErr,
    z: z ? polyToPlain(z) : null,
    zLattice: zLattice ? polyToPlain(zLattice) : null,
    facZ: facZ, facLattice: facLattice,
    factor: polyToPlain(spec.factorPoly),
    demazure: demazure,
    denom: denom,
    states: states.map(s => ({ w: s.w, cuts: s.st.cuts, horiz: s.st.horiz })),
    tEnum: tEnum, tZ: tZ, tTotal: Date.now() - t0
  };
}

/** Exact division by one of the linear factors of phi. */
function divideByFactor(ring, p, f) {
  const nv = ring.nv;
  const E = () => new Array(nv).fill(0);
  const shift = (() => { const e = E(); e[ring.yj(f.i)] = 1; return e; })();
  if (f.kind === 'one') {
    // 1 - y_j/y_i  =  (y_i - y_j)/y_i
    const A = [1n, E()];
    const B = [1n, (() => { const e = E(); e[ring.yj(f.j)] = 1; return e; })()];
    return P_divLinear(P_mulMono(p, 1, shift), ring.yj(f.i), A, B);
  }
  // q y_j/y_i - 1  =  (q y_j - y_i)/y_i
  const A = [1n, (() => { const e = E(); e[0] = 2; return e; })()];
  const B = [1n, shift];
  return P_divLinear(P_mulMono(p, 1, shift), ring.yj(f.j), A, B);
}

/* ------------------------------------------------------------------------
   Drawing states, ported from the paper's TikZ.

   \icegrid{N}{n} puts the vertical line for the i-th column from the left at
   x = 2i-1 (running from y = 0 to y = 2n) and the horizontal line for the
   j-th row from the bottom at y = 2j-1 (running from x = 0 to x = 2N), with a
   circled "spin" node on every edge: at (2i-1, 2j-2) below each vertex, at
