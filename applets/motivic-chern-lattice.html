   (2i-2, 2j-1) to its left, at (2i-1, 2n) on the top boundary (labelled above
   with the column number) and at (2N, 2j-1) on the right boundary (labelled
   to the right with the row number).  Columns are numbered from the RIGHT.

   Colour paths are drawn between the centres of those circles, with
   `to [out=-90,in=180,looseness=2]`-style corners; where a vertical edge
   carries several colours they are drawn side by side, the smaller colour to
   the left (this is the convention of the crossing-number argument in the
   proof of Theorem 3.6, "the path runs to the left of the g-coloured path if
   d_i < g").
   ------------------------------------------------------------------------ */

const COLOURS_LIGHT = [
  '#e02020', /* c1  red      */
  '#00a300', /* c2  darkgreen*/
  '#1141d6', /* c3  blue     */
  '#96500a', /* c4  brown    */
  '#c000c0', /* c5  magenta  */
  '#e07800', /* c6  orange   */
  '#00909a', /* c7  teal     */
  '#6a3fd0'  /* c8  violet   */
];
const COLOURS_DARK = [
  '#ff6b6b', '#3fd23f', '#6f9bff', '#d09b5a',
  '#ee7ded', '#ffab3d', '#33c6d2', '#a98cf5'
];

function colourOf(c, dark) {
  const pal = dark ? COLOURS_DARK : COLOURS_LIGHT;
  return pal[(c - 1) % pal.length];
}

function blendColours(list, dark) {
  let r = 0, g = 0, b = 0;
  for (const c of list) {
    const h = colourOf(c, dark);
    r += parseInt(h.slice(1, 3), 16);
    g += parseInt(h.slice(3, 5), 16);
    b += parseInt(h.slice(5, 7), 16);
  }
  const k = list.length || 1;
  const hex = v => Math.round(v / k).toString(16).padStart(2, '0');
  return '#' + hex(r) + hex(g) + hex(b);
}

/* the drawing options */
const DEFAULT_DRAW = {
  unit: 21,            // pixels per TikZ unit
  radius: 10,          // spin-circle radius, px
  lw: 3,               // path line width, px
  gridlw: 1,
  offset: 0.115,       // side-by-side separation on a multi-colour edge, TikZ units
  labels: true,        // column/row numbers
  params: false,       // also show x_i and y_j
  fontSize: 12,
  dark: false
};

function svgEscape(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/**
 * Render one state.  `st` may be null to draw an empty grid.
 * Returns an SVG string.
 */
function renderState(bd, st, opts) {
  const o = Object.assign({}, DEFAULT_DRAW, opts || {});
  const n = bd.n, N = bd.N;
  const U = o.unit;
  const pad = o.radius + 2;
  const longest = arr => (arr || []).reduce((m, s) => Math.max(m, String(s).length), 1);
  const labW = o.labels
    ? (o.params ? 0.62 * o.fontSize * Math.max(2, longest(o.rowLabels)) + 6
                : 1.3 * o.fontSize)
    : 0;
  const padL = pad;
  const padR = pad + labW;
  const padT = pad + (o.labels ? 1.5 * o.fontSize : 0);
  const padB = pad;
  const W = 2 * N * U + padL + padR;
  const H = 2 * n * U + padT + padB;

  // TikZ (tx,ty) -> SVG
  const X = tx => padL + tx * U;
  const Y = ty => padT + (2 * n - ty) * U;

  const vx = j => 2 * (N - j) + 1;          // column j (numbered from the right)
  const vy = i => 2 * (n - i) + 1;          // row i (numbered from the top)

  const parts = [];
  const gridStroke = o.dark ? '#8a8f98' : '#444';
  const textCol = o.dark ? '#e8eaed' : '#111';
  const plusStroke = o.dark ? '#8a8f98' : '#444';
  const paper = o.dark ? '#171a1f' : '#ffffff';

  // grid lines
  for (let j = 1; j <= N; j++) {
    parts.push('<line x1="' + X(vx(j)) + '" y1="' + Y(0) + '" x2="' + X(vx(j)) +
      '" y2="' + Y(2 * n) + '" stroke="' + gridStroke + '" stroke-width="' + o.gridlw + '"/>');
  }
  for (let i = 1; i <= n; i++) {
    parts.push('<line x1="' + X(0) + '" y1="' + Y(vy(i)) + '" x2="' + X(2 * N) +
      '" y2="' + Y(vy(i)) + '" stroke="' + gridStroke + '" stroke-width="' + o.gridlw + '"/>');
  }

  // ---- colour paths ------------------------------------------------------
  if (st) {
    const rank = (mask, c) => {
      const l = maskList(mask);
      const k = l.indexOf(c);
      return (k - (l.length - 1) / 2) * o.offset;
    };
    const segs = [];
    for (let i = 1; i <= n; i++) {
      for (let k = 0; k < N; k++) {
        const col = N - k;
        const left = st.horiz[i - 1][k], top = st.cuts[i - 1][k];
        const right = st.horiz[i - 1][k + 1], bottom = st.cuts[i][k];
        const cx = vx(col), cy = vy(i);
        const involved = new Set(maskList(top | bottom));
        if (left) involved.add(left);
        if (right) involved.add(right);
        for (const c of Array.from(involved).sort((a, b) => a - b)) {
          const inTop = !!(top & bit(c)), inLeft = (left === c);
          const outBot = !!(bottom & bit(c)), outRight = (right === c);
          const tX = cx + rank(top, c), bX = cx + rank(bottom, c);
          const P = {
            top: [tX, cy + 1], bottom: [bX, cy - 1],
            left: [cx - 1, cy], right: [cx + 1, cy]
          };
          // z: horizontals first, then corners, then verticals -- as in the paper,
          // where a vertical strand crossing a horizontal one is drawn on top
          const line = (a, b, z) => segs.push({ c: c, z: z, d: 'M' + X(a[0]) + ' ' + Y(a[1]) +
            ' L ' + X(b[0]) + ' ' + Y(b[1]) });
          const corner = (a, b, ctrl) => segs.push({ c: c, z: 1, d: 'M' + X(a[0]) + ' ' + Y(a[1]) +
            ' Q ' + X(ctrl[0]) + ' ' + Y(ctrl[1]) + ' ' + X(b[0]) + ' ' + Y(b[1]) });
          if (inTop && inLeft && outBot && outRight) {
            // Remark 3.3: all four edges carry the colour; two paths cross
            line(P.top, P.bottom, 2);
            line(P.left, P.right, 0);
          } else if (inTop && outBot) {
            line(P.top, P.bottom, 2);
          } else if (inLeft && outRight) {
            line(P.left, P.right, 0);
          } else {
            if (inTop && outRight) corner(P.top, P.right, [tX, cy]);
            if (inLeft && outBot) corner(P.left, P.bottom, [bX, cy]);
          }
        }
      }
    }
    segs.sort((a, b) => a.z - b.z);
    for (const s of segs) {
      parts.push('<path d="' + s.d + '" fill="none" stroke="' + colourOf(s.c, o.dark) +
        '" stroke-width="' + o.lw + '" stroke-linecap="round"/>');
    }
  }

  // ---- spin circles ------------------------------------------------------
  const circle = (tx, ty, label, stroke, colours) => {
    parts.push('<circle cx="' + X(tx) + '" cy="' + Y(ty) + '" r="' + o.radius +
      '" fill="' + paper + '" stroke="' + stroke + '" stroke-width="1.6"/>');
    const fs = colours && colours.length > 1
      ? Math.max(7, o.fontSize - 3 - (colours.length - 2)) : o.fontSize;
    if (colours && colours.length > 1) {
      // one tspan per colour so each numeral keeps its own colour
      let inner = '';
      colours.forEach((c, idx) => {
        if (idx) inner += '<tspan fill="' + textCol + '">,</tspan>';
        inner += '<tspan fill="' + colourOf(c, o.dark) + '">' + c + '</tspan>';
      });
      parts.push('<text x="' + X(tx) + '" y="' + Y(ty) + '" font-size="' + fs +
        '" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="Georgia, serif">' + inner + '</text>');
    } else {
      parts.push('<text x="' + X(tx) + '" y="' + Y(ty) + '" font-size="' + fs +
        '" fill="' + textCol + '" text-anchor="middle" dominant-baseline="central" ' +
        'font-family="Georgia, serif">' + svgEscape(label) + '</text>');
    }
  };

  const vertLabel = mask => {
    const l = maskList(mask);
    if (!l.length) return { txt: '+', stroke: plusStroke, cols: null };
    if (l.length === 1) return { txt: String(l[0]), stroke: colourOf(l[0], o.dark), cols: null };
    return { txt: l.join(','), stroke: blendColours(l, o.dark), cols: l };
  };
  const horLabel = c => c === PLUS
    ? { txt: '+', stroke: plusStroke, cols: null }
    : { txt: String(c), stroke: colourOf(c, o.dark), cols: null };

  for (let j = 1; j <= N; j++) {
    for (let i = 0; i <= n; i++) {
      // the vertical edge above row i+1 (i = 0 is the top boundary)
      const mask = st ? st.cuts[i][N - j] : (i === 0 ? bd.top[j - 1] : 0);
      const L = vertLabel(mask);
      circle(vx(j), 2 * (n - i), L.txt, L.stroke, L.cols);
    }
  }
  for (let i = 1; i <= n; i++) {
    for (let k = 0; k <= N; k++) {
      const c = st ? st.horiz[i - 1][k] : (k === N ? bd.right[i - 1] : PLUS);
      const L = horLabel(c);
      circle(2 * k, vy(i), L.txt, L.stroke, L.cols);
    }
  }

  // ---- boundary labels ---------------------------------------------------
  if (o.labels) {
    for (let j = 1; j <= N; j++) {
      const txt = o.params ? ((o.colLabels && o.colLabels[j - 1]) || ('y' + j)) : String(j);
      parts.push('<text x="' + X(vx(j)) + '" y="' + (Y(2 * n) - o.radius - 5) +
        '" font-size="' + (o.fontSize - 1) + '" fill="' + textCol +
        '" text-anchor="middle" font-family="Georgia, serif" font-style="italic">' +
        svgEscape(txt) + '</text>');
    }
    for (let i = 1; i <= n; i++) {
      const txt = o.params ? ((o.rowLabels && o.rowLabels[i - 1]) || ('x' + i)) : String(i);
      parts.push('<text x="' + (X(2 * N) + o.radius + 5) + '" y="' + Y(vy(i)) +
        '" font-size="' + (o.fontSize - 1) + '" fill="' + textCol +
        '" text-anchor="start" dominant-baseline="central" ' +
        'font-family="Georgia, serif" font-style="italic">' + svgEscape(txt) + '</text>');
    }
  }

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H +
    '" width="' + W + '" height="' + H + '" role="img">' + parts.join('') + '</svg>';
}

/* ------------------------------------------------------------------------
   Turning exact Laurent polynomials into readable mathematics.
   ------------------------------------------------------------------------ */

const SUP = { '-': '−', '0': '⁰', '1': '¹', '2': '²', '3': '³',
  '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
  '/': 'ᐟ' };

function hEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/** the deformation parameter, written the way the relevant section writes it */
function tParamHtml(halves, tDisplay) {
  if (halves === 0) return '';
  let sym = 't', h = halves;
  if (tDisplay === 'q=1/t') { sym = 'q'; h = -halves; }
  else if (tDisplay === 'q=t') { sym = 'q'; }
  if (h === 2) return sym;
  if (h % 2 === 0) return sym + '<sup>' + (h / 2) + '</sup>';
  return sym + '<sup>' + h + '/2</sup>';
}

function varHtml(name, sub, pow) {
  let s = '<i>' + name + '</i><sub>' + sub + '</sub>';
  if (pow !== 1) s += '<sup>' + pow + '</sup>';
  return s;
}

/** One monomial as {sign:+-1, html:'...'} with negative powers put in a denominator. */
function monoHtml(ring, e, coeff, opts) {
  const tD = opts.tDisplay || 't';
  const frac = opts.frac !== false;
  let num = [], den = [];
  const tp = e[0];
  if (tp) {
    // choose the side by the sign of the exponent as displayed: with q = t^-1 a
    // positive power of t is a negative power of q and belongs in the denominator
    const shown = (tD === 'q=1/t') ? -tp : tp;
    if (!frac || shown > 0) num.push(tParamHtml(tp, tD));
    else den.push(tParamHtml(-tp, tD));
  }
  for (let s = 1; s < ring.nv; s++) {
    const p = e[s];
    if (!p) continue;
    const sl = ring.slots[s];
    const h = k => sl.kind === 'p'
      ? ('<i>' + sl.name + '</i>' + (k === 1 ? '' : '<sup>' + k + '</sup>'))
      : varHtml(sl.name, sl.idx, k);
    if (!frac || p > 0) num.push(h(p)); else den.push(h(-p));
  }
  let mag = coeff < 0n ? -coeff : coeff;
  let s = '';
  if (mag !== 1n || (num.length === 0 && den.length === 0)) s += mag.toString();
  if (num.length) s += (s ? '' : '') + num.join('');
  if (den.length) {
    if (!s) s = '1';
    s += '/' + (den.length > 1 ? '(' + den.join('') + ')' : den[0]);
  }
  return { sign: coeff < 0n ? -1 : 1, html: s };
}

/** A whole polynomial. */
function polyHtml(p, opts) {
  opts = opts || {};
  const terms = P_termList(p);
  if (!terms.length) return '0';
  const max = opts.maxTerms || Infinity;
  const shown = terms.slice(0, max);
  let out = '';
  shown.forEach((tm, idx) => {
    const m = monoHtml(p.ring, tm.e, tm.c, opts);
    if (idx === 0) out += (m.sign < 0 ? '−' : '') + m.html;
    else out += (m.sign < 0 ? ' − ' : ' + ') + m.html;
  });
  if (terms.length > shown.length) {
    out += ' <span class="muted">+ … (' + (terms.length - shown.length) + ' more)</span>';
  }
  return out;
}

/** LaTeX, for copying out. */
function polyLatex(p, opts) {
  opts = opts || {};
  const ring = p.ring;
  const tD = opts.tDisplay || 't';
  const terms = P_termList(p);
  if (!terms.length) return '0';
  let out = '';
  terms.forEach((tm, idx) => {
    const e = tm.e;
    let mag = tm.c < 0n ? -tm.c : tm.c;
    let s = '';
    const bits = [];
    if (e[0]) {
      let sym = 't', h = e[0];
      if (tD === 'q=1/t') { sym = 'q'; h = -h; }
      else if (tD === 'q=t') sym = 'q';
      bits.push(h === 2 ? sym : (h % 2 === 0 ? sym + '^{' + (h / 2) + '}'
        : sym + '^{' + h + '/2}'));
    }
    for (let s = 1; s < ring.nv; s++) {
      const q = e[s];
      if (!q) continue;
      const sl = ring.slots[s];
      const base = sl.kind === 'p' ? sl.name : sl.name + '_{' + sl.idx + '}';
      bits.push(q === 1 ? base : base + '^{' + q + '}');
    }
    if (mag !== 1n || !bits.length) s += mag.toString();
    s += bits.join(' ');
    if (idx === 0) out += (tm.c < 0n ? '-' : '') + s;
    else out += (tm.c < 0n ? ' - ' : ' + ') + s;
  });
  return out;
}

/* --------------------------------------------------- the figure templates */

function sigmaHtml(mask) {
  const l = maskList(mask);
  return l.length ? '{' + l.join(',') + '}' : '∅';
}

/** The entry of Figure 1/6/8 for this vertex, with the counts substituted,
 *  so the reader can see the figure's formula and its value side by side. */
function caseTemplateHtml(family, cas, left, top, right, r, i, j) {
  const S = top;
  const nS = maskCount(S, 1, r);
  const x = '<i>x</i><sub>' + i + '</sub>', y = '<i>y</i><sub>' + j + '</sub>';
  // show the figure's entry with the set sizes substituted, exponent 0 included
  const pw = (base, k) => k === 1 ? base : base + '<sup>' + k + '</sup>';
  let c, d, a, b, p;
  if (family === 'whittaker') {
    switch (cas) {
      case 1: return pw('(−t)', nS);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return pw('t', a) + '(' + x + ' + ' + pw('t', b) + y + ')';
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return pw('(−t)', p) + pw('t', a);
      case 4:
        c = left; a = maskCount(S, c + 1, r);
        return '(1−t)' + x + pw('(−t)', a);
      case 5:
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '(1−t)' + x + pw('(−t)', p) + pw('t', a);
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '−' + y + '(1−t)' + pw('(−1)', p) + pw('t', a);
    }
  } else if (family === 'ktheoretic') {
    switch (cas) {
      case 1: return pw('(−t)', nS);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return pw('t', a) + '(−' + x + '/' + y + ' + ' + pw('t', b) + ')';
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return pw('(−t)', p) + pw('t', a);
      case 4:
        c = left; a = maskCount(S, c + 1, r);
        return '−(1−t)' + x + '/' + y + pw('(−t)', a);
      case 5:
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '−(1−t)' + x + '/' + y + pw('(−t)', p) + pw('t', a);
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '−(1−t)' + pw('(−1)', p) + pw('t', a);
    }
  } else if (family === 'dual') {
    switch (cas) {
      case 1: return pw('(−t' + x + ')', nS);
      case 2:
        c = left; a = maskCount(S, c + 1, r); b = (S & bit(c)) ? 1 : 0;
        return pw('t', a) + pw(x, nS) + '(−1/' + x + ' + ' + pw('t', b) + '/' + y + ')';
      case 3:
        c = right; p = maskCount(S, 1, c - 1); a = maskCount(S, c + 1, r);
        return pw('(−t)', p) + pw('t', a) + pw(x, nS - 1);
      case 4:
        c = left; a = maskCount(S, c + 1, r);
        return '(t−1)' + pw(x, -1) + pw('(−t)', a) + pw(x, nS + 1);
      case 5:
        c = left; d = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '(t−1)' + pw(x, -1) + pw('(−t)', p) + pw('t', a) + pw(x, nS);
      case 6:
        d = left; c = right; p = maskCount(S, c + 1, d - 1); a = maskCount(S, d + 1, r);
        return '(t−1)' + pw(y, -1) + pw('(−1)', p) + pw('t', a) + pw(x, nS);
    }
  }
  return '0';
}

/** The vertex's shape in words, e.g. "Case 3: + | {2,3} -> 2 | {3}". */
function caseDescription(cas, left, top, right, bottom) {
  const h = c => c === PLUS ? '+' : String(c);
  return 'Case ' + cas + ':  left ' + h(left) + ', top ' + sigmaHtml(top) +
    ', right ' + h(right) + ', bottom ' + sigmaHtml(bottom);
}

/* ------------------------------------------------------------------------
   The self-test.  Everything here is a statement from the paper, checked
   exactly (as an identity of Laurent polynomials over Z) at run time, so a
   reader can see for themselves that the engine reproduces the paper.
   ------------------------------------------------------------------------ */

function P_negateVar(p, slot) {
  const m = new Map();
  for (const [k, v] of p.terms) {
    const e = expOf(k);
    m.set(k, (e[slot] % 2 === 0) ? v : -v);
  }
  return { ring: p.ring, terms: m };
}

function runSelfTest(opts) {
  opts = opts || {};
  const deep = !!opts.deep;
  const results = [];
  const t0 = Date.now();
  const ok = (name, cond, detail) => results.push({ name, ok: !!cond, detail: detail || '' });

  /* ---- 1. the paper's worked example, Example 4.2 --------------------- */
  {
    const ring = makeRing(2, 2);
    const e = [1, 2], s = [2, 1], lam = [2, 1];
    const bdA = boundaryFromData(2, 2, 2, e, s, lam);
    const rA = enumerateStates(bdA, {});
    ok('Example 4.2: B(e,s,(2,1)) has exactly one admissible state',
      rA.count === 1, 'found ' + rA.count);
    const zA = partitionFunction(bdA, rA.states, ring, 'ktheoretic').poly;
    // 1 - x_1/y_1
    const eA = new Array(ring.nv).fill(0); eA[ring.xi(1)] = 1; eA[ring.yj(1)] = -1;
    const wantA = P_sub(P_const(ring, 1), P_mono(ring, 1, eA));
    ok('Example 4.2: Z^{(2,1)}_{e,s} = 1 − x₁/y₁', P_equals(zA, wantA), polyHtml(zA, {}));

    const bdB = boundaryFromData(2, 2, 2, e, e, lam);
    const rB = enumerateStates(bdB, {});
    ok('Example 4.2: B(e,e,(2,1)) has exactly two admissible states',
      rB.count === 2, 'found ' + rB.count);
    const zB = partitionFunction(bdB, rB.states, ring, 'ktheoretic').poly;
    const eB = new Array(ring.nv).fill(0); eB[ring.xi(2)] = 1; eB[ring.yj(1)] = -1;
    const tt = new Array(ring.nv).fill(0); tt[0] = 2;
    const wantB = P_sub(P_sub(P_mono(ring, 1, tt), P_const(ring, 1)),
      P_mul(P_mono(ring, 1, tt), P_sub(P_const(ring, 1), P_mono(ring, 1, eB))));
    ok('Example 4.2: Z^{(2,1)}_{e,e} = (t−1) − t(1 − x₂/y₁)',
      P_equals(zB, wantB), polyHtml(zB, {}));

    // the per-vertex weight tables printed alongside the example
    const cells = {};
    for (const v of stateVertices(bdA, rA.states[0], ring, 'ktheoretic')) {
      cells[v.row + ',' + v.col] = v.weight;
    }
    const one = P_const(ring, 1);
    ok('Example 4.2: the printed weight table of the single state',
      P_equals(cells['1,2'], one) && P_equals(cells['1,1'], wantA) &&
      P_equals(cells['2,2'], one) && P_equals(cells['2,1'], one));
  }

  /* ---- 2. the three weight tables agree with their stated derivations -- */
  {
    for (const r of [1, 2, 3]) {
      const ring = makeRing(1, 1);
      const xs = ring.xi(1), ys = ring.yj(1);
      let badK = 0, badD = 0, n = 0;
      const subsets = [];
      for (let m = 0; m < (1 << r); m++) subsets.push(m);
      for (let left = 0; left <= r; left++) {
        for (let right = 0; right <= r; right++) {
          for (const top of subsets) {
            for (const bot of subsets) {
              const cas = vertexCase(left, top, right, bot);
              if (!cas) continue;
              n++;
              const W = vertexWeight(ring, 'whittaker', cas, left, top, right, r, xs, ys);
              const K = vertexWeight(ring, 'ktheoretic', cas, left, top, right, r, xs, ys);
              const D = vertexWeight(ring, 'dual', cas, left, top, right, r, xs, ys);
              // K = (W with x -> -x) / y^{left is a colour}
              let derived = P_negateVar(W, xs);
              if (left !== PLUS) {
                const e = new Array(ring.nv).fill(0); e[ys] = -1;
                derived = P_mulMono(derived, 1, e);
              }
              if (!P_equals(K, derived)) badK++;
              // D = (K with x,y inverted) * x^b y^{-l}
              const inv = identitySpec(ring);
              inv[xs] = [xs, -1]; inv[ys] = [ys, -1];
              let d2 = P_relabel(K, inv);
              const e2 = new Array(ring.nv).fill(0);
              e2[xs] = maskCount(bot, 1, r);
              e2[ys] = (left === PLUS ? 0 : -1);
              d2 = P_mulMono(d2, 1, e2);
              if (!P_equals(D, d2)) badD++;
            }
          }
        }
      }
      ok('Figure 4 = Figure 1 with x ↦ −x and ÷y when the left edge is coloured (r=' + r +
         ', ' + n + ' vertices)', badK === 0, badK + ' mismatches');
      ok('Figure 8 = Figure 4 with x,y inverted, times x^b y^{−l} (r=' + r + ')',
         badD === 0, badD + ' mismatches');
    }
  }

  /* ---- 3. the Yang-Baxter equation, Theorem 3.7 ----------------------- */
  {
    const rmax = deep ? 3 : 2;
    for (let r = 1; r <= rmax; r++) {
      const ring = makeRing(2, 1);
      const xi = ring.xi(1), xj = ring.xi(2), ys = ring.yj(1);
      const horiz = []; for (let c = 0; c <= r; c++) horiz.push(c);
      const subsets = []; for (let m = 0; m < (1 << r); m++) subsets.push(m);
      const E = () => new Array(ring.nv).fill(0);
      const T = new Array(ring.nv).fill(0); T[0] = 2;

      // Figure 3, the R-matrix.  Arguments: bottom-left, top-left, top-right,
      // bottom-right; the strands run bottom-left -> top-right and
      // top-left -> bottom-right.
      function Rw(bl, tl, tr, br) {
        const mk = (a, b) => P_sub(P_var(ring, a, 1), P_mulMono(P_var(ring, b, 1), 1, T));
        const diff = () => P_sub(P_var(ring, xi, 1), P_var(ring, xj, 1));
        const oneMinusT = v => P_sub(P_var(ring, v, 1), P_mulMono(P_var(ring, v, 1), 1, T));
        if (bl === 0 && tl === 0 && tr === 0 && br === 0) return mk(xj, xi);
        if (bl && bl === tl && tl === tr && tr === br) return mk(xi, xj);
        if (bl && !tl && !tr && br === bl) return oneMinusT(xi);
        if (!bl && tl && tr === tl && !br) return oneMinusT(xj);
        if (!bl && tl && !tr && br === tl) return P_mulMono(diff(), 1, T);
        if (bl && !tl && tr === bl && !br) return diff();
        if (bl && tl && bl !== tl) {
          const c = Math.min(bl, tl), d = Math.max(bl, tl);
          if (bl === c && tl === d && tr === d && br === c) return oneMinusT(xi);
          if (bl === c && tl === d && tr === c && br === d) return P_mulMono(diff(), 1, T);
          if (bl === d && tl === c && tr === c && br === d) return oneMinusT(xj);
          if (bl === d && tl === c && tr === d && br === c) return diff();
        }
        return P_zero(ring);
      }
      function Tw(family, left, top, right, bot, xslot) {
        const cas = vertexCase(left, top, right, bot);
        if (!cas) return P_zero(ring);
        return vertexWeight(ring, family, cas, left, top, right, r, xslot, ys);
      }
      let bad = 0, tot = 0;
      for (const family of ['whittaker', 'ktheoretic']) {
        for (const a of horiz) for (const b of horiz)
          for (const d of horiz) for (const e_ of horiz)
            for (const c of subsets) for (const f of subsets) {
              tot++;
              const L = P_zero(ring), Rr = P_zero(ring);
              for (const al of horiz) for (const be of horiz) {
                const R = Rw(a, b, al, be);
                if (P_isZero(R)) continue;
                for (const ga of subsets) {
                  const w1 = Tw(family, al, c, d, ga, xi);
                  if (P_isZero(w1)) continue;
                  const w2 = Tw(family, be, ga, e_, f, xj);
                  if (P_isZero(w2)) continue;
                  P_addInto(L, P_mul(P_mul(R, w1), w2));
                }
              }
              for (const ga of subsets) for (const al of horiz) {
                const w1 = Tw(family, b, c, al, ga, xj);
                if (P_isZero(w1)) continue;
                for (const be of horiz) {
                  const w2 = Tw(family, a, ga, be, f, xi);
                  if (P_isZero(w2)) continue;
                  const R = Rw(be, al, d, e_);
                  if (P_isZero(R)) continue;
                  P_addInto(Rr, P_mul(P_mul(w1, w2), R));
                }
              }
              if (!P_equals(L, Rr)) bad++;
            }
      }
      ok('Yang–Baxter equation with the R-matrix of Figure 3 (r=' + r + ', ' + tot +
         ' boundary choices, both weight families)', bad === 0, bad + ' failures');
    }
  }

  /* ---- 4. Theorem 4.6: the Demazure closed form ----------------------- */
  {
    const cases = deep
      ? [[2, 2, [2, 1]], [2, 3, [3, 1]], [3, 3, [3, 2, 1]], [3, 4, [4, 2, 2]], [4, 4, [4, 3, 2, 1]]]
      : [[2, 2, [2, 1]], [2, 3, [3, 1]], [3, 3, [3, 2, 1]], [3, 4, [4, 2, 2]]];
    let bad = 0, tot = 0;
    for (const [n, N, lam] of cases) {
      const ring = makeRing(n, N);
      for (const sigma of permAll(n)) {
        if (!permEq(maxCosetRep(sigma, lam), sigma)) continue;
        for (const w of permAll(n)) {
          const bd = boundaryFromData(n, N, n, sigma, w, lam);
          const res = enumerateStates(bd, {});
          const z = partitionFunction(bd, res.states, ring, 'ktheoretic').poly;
          const dz = demazureZ(ring, n, sigma, w, lam);
          tot++;
          if (dz === null || !P_equals(z, dz)) bad++;
        }
      }
    }
    ok('Theorem 4.6: Z^λ_{σ,w} = t^{ℓ(σ)} τ_w^{−1} τ_{σw₀}[∏∏(1−x_i/y_j)] (' +
       tot + ' boundary conditions)', bad === 0, bad + ' failures');
  }

  /* ---- 5. Proposition 8.2 --------------------------------------------- */
  {
    let bad = 0, tot = 0;
    for (const [n, N, lam] of [[2, 3, [3, 1]], [3, 3, [3, 2, 1]], [3, 4, [4, 2, 2]]]) {
      const ring = makeRing(n, N);
      for (const sigma of permAll(n)) {
        if (!permEq(maxCosetRep(sigma, lam), sigma)) continue;
        for (const w of permAll(n)) {
          const bd = boundaryFromData(n, N, n, sigma, w, lam);
          const res = enumerateStates(bd, {});
          const om = partitionFunction(bd, res.states, ring, 'whittaker').poly;
          let z = partitionFunction(bd, res.states, ring, 'ktheoretic').poly;
          for (let i = 1; i <= n; i++) z = P_negateVar(z, ring.xi(i));
          const e = new Array(ring.nv).fill(0);
          for (let j = 1; j <= N; j++) e[ring.yj(j)] = lam.filter(a => a > j).length;
          tot++;
          if (!P_equals(om, P_mulMono(z, 1, e))) bad++;
        }
      }
    }
    ok('Proposition 8.2: Ω^λ_{σ,w}(x;y) = (∏_j y_j^{#{i:λ_i>j}}) Z^λ_{σ,w}(−x;y) (' +
       tot + ' cases)', bad === 0, bad + ' failures');
  }

  /* ---- 6. the dual weights against the K-theoretic ones ---------------- */
  {
    let bad = 0, tot = 0;
    for (const n of [2, 3]) {
      const box = []; for (let k = n; k >= 1; k--) box.push(k);
      const ring = makeRing(n, n);
      for (const sigma of permAll(n)) for (const w of permAll(n)) {
        const bd = boundaryFromData(n, n, n, sigma, w, box);
        const res = enumerateStates(bd, {});
        const zt = partitionFunction(bd, res.states, ring, 'dual').poly;
        const z = partitionFunction(bd, res.states, ring, 'ktheoretic').poly;
        const inv = identitySpec(ring);
        for (let i = 1; i <= n; i++) inv[ring.xi(i)] = [ring.xi(i), -1];
        for (let j = 1; j <= n; j++) inv[ring.yj(j)] = [ring.yj(j), -1];
        const e = new Array(ring.nv).fill(0);
        for (let i = 1; i <= n; i++) { e[ring.xi(i)] = n - i; e[ring.yj(i)] = -(n - i); }
        tot++;
        if (!P_equals(zt, P_mulMono(P_relabel(z, inv), 1, e))) bad++;
      }
    }
    ok('Z̃^□_{σ,w} = x^ρ y^{−ρ} Z^□_{σ,w}(x^{−1};y^{−1})  (' + tot + ' cases)',
       bad === 0, bad + ' failures');
  }

  /* ---- 7. Lemma 8.6, Properties A and B ------------------------------- */
  {
    for (const r of [1, 2, 3]) {
      const ring = makeRing(1, 1);
      const xs = ring.xi(1), ys = ring.yj(1);
      const T = new Array(ring.nv).fill(0); T[0] = 2;
      const CB = (a, b, c, d) => {
        const X = P_var(ring, xs, 1), Y = P_var(ring, ys, 1);
        const k = '' + a + b + c + d;
        if (k === '0000') return P_const(ring, 1);
        if (k === '1111') return P_add(X, P_mulMono(Y, 1, T));
        if (k === '0101') return P_mulMono(P_const(ring, -1), 1, T);
        if (k === '1010') return P_add(X, Y);
        if (k === '1001') return P_sub(X, P_mulMono(X, 1, T));
        if (k === '0110') return P_const(ring, 1);
        return P_zero(ring);
      };
      let badA = 0;
      for (let a = 0; a <= 1; a++) for (let b = 0; b <= 1; b++)
        for (let c = 0; c <= 1; c++) for (let d = 0; d <= 1; d++) {
          const lhs = CB(a, b, c, d);
          const As = a ? Array.from({ length: r }, (_, i) => i + 1) : [PLUS];
          const Bs = []; for (let m = 0; m < (1 << r); m++) if (popcount(m) === b) Bs.push(m);
          for (const A of As) for (const Bm of Bs) {
            const rhs = P_zero(ring);
            const Cs = c ? Array.from({ length: r }, (_, i) => i + 1) : [PLUS];
            for (const C of Cs) {
              for (let m = 0; m < (1 << r); m++) {
                if (popcount(m) !== d) continue;
                const cas = vertexCase(A, Bm, C, m);
                if (!cas) continue;
                P_addInto(rhs, vertexWeight(ring, 'whittaker', cas, A, Bm, C, r, xs, ys));
              }
            }
            if (!P_equals(lhs, rhs)) badA++;
          }
        }
      ok('Lemma 8.6, Property A (colour merging) with the Whittaker weights (r=' + r + ')',
         badA === 0, badA + ' mismatches');
      let badB = 0, totB = 0;
      for (let m = 0; m < (1 << r); m++) {
        const l = maskList(m);
        for (let k = 0; k + 1 < l.length; k++) {
          const c = l[k], d = l[k + 1];
          totB++;
          for (const fam of ['whittaker', 'ktheoretic']) {
            const s = P_add(
              vertexWeight(ring, fam, 3, PLUS, m, c, r, xs, ys),
              vertexWeight(ring, fam, 3, PLUS, m, d, r, xs, ys));
            if (!P_isZero(s)) badB++;
          }
        }
      }
      ok('Lemma 8.6, Property B (r=' + r + ', ' + totB + ' adjacent pairs)',
         badB === 0, badB + ' nonzero');
    }
  }

  /* ---- 8. factorisation ------------------------------------------------ */
  {
    const ring = makeRing(3, 3);
    const mk = f => { const e = new Array(ring.nv).fill(0); f(e); return e; };
    // the seed of Theorem 4.6 must come apart into its own linear factors
    const seed = baseProduct(ring, [3, 2, 1]);
    let fac = factorise(seed, { deadline: Date.now() + 3000 });
    ok('the seed ∏∏(1−x_i/y_j) factors into its 3 binomials',
      fac && fac.complete && fac.factors.length === 3 &&
      fac.factors.every(f => f.exp === 1 && P_numTerms(f.poly) === 2),
      fac ? fac.factors.length + ' factors' : 'no factorisation');

    // (1-t)^4
    let p = P_const(ring, 1);
    const oneMinusT = P_sub(P_const(ring, 1), P_t(ring, 1));
    for (let i = 0; i < 4; i++) p = P_mul(p, oneMinusT);
    fac = factorise(p, { deadline: Date.now() + 3000 });
    ok('(1−t)⁴ factors with multiplicity 4',
      fac && fac.complete && fac.factors.length === 1 && fac.factors[0].exp === 4,
      fac ? JSON.stringify(fac.factors.map(f => f.exp)) : 'none');

    // 1 + t + t^2 is irreducible over the binomials, and must be left alone
    const irr = P_add(P_add(P_const(ring, 1), P_t(ring, 1)), P_t(ring, 2));
    fac = factorise(irr, { deadline: Date.now() + 3000 });
    ok('1 + t + t² is left unfactored rather than mangled',
      fac && fac.factors.length === 0 && fac.rest && P_equals(fac.rest, irr));

    // the ground states, which are exactly the seed
    let bad = 0, tot = 0, complete = 0;
    for (const n of (deep ? [2, 3, 4] : [2, 3])) {
      const rg = makeRing(n, n);
      const box = boxPartition(n);
      for (const w of permAll(n)) {
        const bd = boundaryFromData(n, n, n, permId(n), w, box);
        const res = enumerateStates(bd, {});
        const z = partitionFunction(bd, res.states, rg, 'ktheoretic').poly;
        if (P_isZero(z)) continue;
        tot++;
        const f = factorise(z, { deadline: Date.now() + 400 });
        if (!f) { bad++; continue; }         // factorise checks itself and returns null on failure
        if (f.complete) complete++;
      }
    }
    ok('every factorisation multiplies back out to the polynomial it came from (' +
       tot + ' partition functions, ' + complete + ' factoring completely)', bad === 0,
       bad + ' failures');
  }

  return { results: results, ms: Date.now() - t0,
           passed: results.filter(x => x.ok).length, total: results.length };
}

</script>
<script>
/* ------------------------------------------------------------------------
   The interface.
   ------------------------------------------------------------------------ */

const UI = {
  page: 'explore',
  inp: null,
  result: null,
  spec: null,
  view: 'grid',
  page_: 0,
  pageSize: 24,
  selected: 0,
  busy: false,
  worker: null,
  workerOk: null,
  jobId: 0,
  pending: new Map(),
  prefs: {}
};

const $ = id => document.getElementById(id);
const el = (tag, attrs, html) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  if (html !== undefined) e.innerHTML = html;
  return e;
};

/* ------------------------------------------------------------- preferences */

function loadPrefs() {
  try { UI.prefs = JSON.parse(localStorage.getItem('mclv.prefs') || '{}'); }
  catch (e) { UI.prefs = {}; }
  if (!UI.prefs.open) UI.prefs.open = {};
}
function savePrefs() {
  try { localStorage.setItem('mclv.prefs', JSON.stringify(UI.prefs)); } catch (e) {}
}

function defaultInput() {
  return {
    preset: 'Z', n: 3, N: 3,
    lambda: [3, 2, 1], sigma: [1, 2, 3], w: [1, 2, 3],
    u: [1, 2, 3], v: [1, 2, 3], lambda0: [1, 0, 0],
    spec: { level: 'basic', u: null, xmap: [], tZero: false, yZero: false, advanced: '' },
    mode: 'auto', timeLimit: 10, storeLimit: 4000, sampleSize: 12, factorLimit: 10
  };
}

function encodeInput(inp) {
  const sp = inp.spec || {};
  const xm = (sp.xmap || []).map(m => (m && m.j) ? (m.j + ':' + (m.k || 0)) : '-').join(',');
  const o = {
    p: inp.preset, n: inp.n, N: inp.N,
    l: inp.lambda.join('.'), s: inp.sigma.join('.'), w: inp.w.join('.'),
    u: inp.u.join('.'), v: inp.v.join('.'), l0: inp.lambda0.join('.'),
    xm: xm, t: sp.tZero ? 1 : 0, y: sp.yZero ? 1 : 0, sl: sp.level || 'basic',
    ad: (sp.level === 'advanced') ? (sp.advanced || '') : '', m: inp.mode
  };
  return Object.keys(o).map(k => k + '=' + encodeURIComponent(o[k])).join('&');
}
function decodeInput(hash) {
  const inp = defaultInput();
  if (!hash) return inp;
  const o = {};
  hash.replace(/^#/, '').split('&').forEach(kv => {
    const i = kv.indexOf('=');
    if (i > 0) o[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  try {
    if (o.p && PRESET_BY_ID[o.p]) inp.preset = o.p;
    if (o.n) inp.n = Math.max(1, Math.min(6, parseInt(o.n, 10)));
    if (o.N) inp.N = Math.max(1, Math.min(12, parseInt(o.N, 10)));
    const pn = s => s ? s.split('.').map(Number) : null;
    if (o.l) inp.lambda = pn(o.l);
    if (o.s) inp.sigma = pn(o.s);
    if (o.w) inp.w = pn(o.w);
    if (o.u) inp.u = pn(o.u);
    if (o.v) inp.v = pn(o.v);
    if (o.l0) inp.lambda0 = pn(o.l0);
    if (o.xm) inp.spec.xmap = o.xm.split(',').map(z => {
      if (z === '-' || !z) return { j: 0, k: 0 };
      const parts = z.split(':').map(Number);
      return { j: parts[0] || 0, k: parts[1] || 0 };
    });
    inp.spec.tZero = o.t === '1';
    inp.spec.yZero = o.y === '1';
    if (o.sl) inp.spec.level = o.sl;
    if (o.ad) { inp.spec.level = 'advanced'; inp.spec.advanced = o.ad; }
    if (o.m) inp.mode = o.m;
  } catch (e) { return defaultInput(); }
  return inp;
}

/* ----------------------------------------------------------- validation */

function fixArity(inp) {
  const n = inp.n;
  const fit = p => (p && p.length === n && p.every(v => v >= 1 && v <= n)) ? p : permId(n);
  inp.sigma = fit(inp.sigma); inp.w = fit(inp.w);
  inp.u = fit(inp.u); inp.v = fit(inp.v);
  if (!inp.lambda || inp.lambda.length !== n) inp.lambda = boxPartition(n);
  if (!inp.lambda0 || inp.lambda0.length !== n) inp.lambda0 = new Array(n).fill(0);
  if (!inp.spec) inp.spec = { level: 'basic', u: null, xmap: [], tZero: false,
    yZero: false, advanced: '' };
  if (!inp.spec.level) inp.spec.level = 'basic';
  if (inp.spec.u && inp.spec.u.length !== n) inp.spec.u = null;
  const xm = inp.spec.xmap || [];
  inp.spec.xmap = [];
  for (let i = 0; i < n; i++) {
    const m = xm[i];
    inp.spec.xmap.push((m && m.j >= 1 && m.j <= Math.max(inp.N, n)) ? m : { j: 0, k: 0 });
  }
  if (!presetInputs(inp.preset).N) inp.N = n;
  if (inp.N < inp.lambda[0]) inp.N = inp.lambda[0];
  return inp;
}

function validate(inp) {
  const errs = [];
  const need = presetInputs(inp.preset);
  if (!(inp.n >= 1 && inp.n <= 6)) errs.push({ f: 'n', m: 'n must be between 1 and 6' });
  if (need.lambda) {
    const l = inp.lambda;
    if (!l || l.length !== inp.n || l.some(a => !isFinite(a)))
      errs.push({ f: 'lambda', m: 'λ needs exactly ' + inp.n + ' parts' });
    else if (l.some((a, i) => i && a > l[i - 1]))
      errs.push({ f: 'lambda', m: 'λ must be weakly decreasing' });
    else if (l[l.length - 1] < 1)
      errs.push({ f: 'lambda', m: 'every part of λ must be at least 1' });
    else if (!(inp.N >= l[0]))
      errs.push({ f: 'N', m: 'N must be at least λ₁ = ' + l[0] });
    else if (inp.N > 12) errs.push({ f: 'N', m: 'N is capped at 12' });
  }
  if (need.lambda0) {
    const l = inp.lambda0;
    if (!l || l.length !== inp.n || l.some(a => !isFinite(a)))
      errs.push({ f: 'lambda0', m: 'λ needs exactly ' + inp.n + ' parts' });
    else if (l.some((a, i) => i && a > l[i - 1]))
      errs.push({ f: 'lambda0', m: 'λ must be weakly decreasing' });
    else if (l[l.length - 1] < 0) errs.push({ f: 'lambda0', m: 'parts must be at least 0' });
  }
  const sp = inp.spec || {};
  if (sp.level === 'advanced' && sp.advanced) {
    const parsed = parseSubstitutions(sp.advanced, inp.n, Math.max(inp.N, inp.n),
      qSignOf(inp.preset));
    for (const m of parsed.errors) errs.push({ f: 'advanced', m: m });
  }
  return errs;
}

function qSignOf(preset) {
  return (preset === 'stabm' || preset === 'stabp' || preset === 'stabu') ? -1 : 1;
}

/* --------------------------------------------------------------- controls */

function renderControls() {
  const inp = UI.inp, need = presetInputs(inp.preset);
  const c = $('controls');
  c.innerHTML = '';

  const g1 = el('div', { class: 'grp' });
  g1.appendChild(el('label', { class: 'hd' }, 'Object'));
  const sel = el('select', { id: 'f-preset' });
  let group = null, cur = null;
  for (const p of PRESETS) {
    if (p.group !== cur) {
      cur = p.group; group = el('optgroup', { label: p.group }); sel.appendChild(group);
    }
    const o = el('option', { value: p.id }, p.label);
    if (p.id === inp.preset) o.setAttribute('selected', 'selected');
    group.appendChild(o);
  }
  g1.appendChild(sel);
  c.appendChild(g1);

  const g2 = el('div', { class: 'grp' });
  g2.appendChild(el('label', { class: 'hd' }, 'Lattice'));
  const row = el('div', { class: 'row' });
  row.appendChild(numField('n', 'rows n (= colours)', inp.n, 1, 6));
  if (need.N) row.appendChild(numField('N', 'columns N', inp.N, 1, 12));
  else {
    const d = el('div', { class: 'field' });
    d.innerHTML = '<div class="lbl">columns N</div><input type="text" value="' + inp.n +
      '" disabled title="this object lives on the n by n square">';
    row.appendChild(d);
  }
  g2.appendChild(row);
  if (!need.N) g2.appendChild(el('div', { class: 'hint' },
    'λ = □ = (n, n−1, …, 1) on the square.'));
  else {
    const isBox = inp.N === inp.n && inp.lambda.every((a, i) => a === inp.n - i);
    const lb = el('label', { class: 'chk tight' });
    lb.innerHTML = '<input type="checkbox" id="f-box"' + (isBox ? ' checked' : '') +
      '> λ = □, N = n';
    g2.appendChild(lb);
  }
  c.appendChild(g2);

  const g3 = el('div', { class: 'grp' });
  g3.appendChild(el('label', { class: 'hd' }, 'Boundary data'));
  if (need.lambda) g3.appendChild(partField('lambda', 'λ  (top boundary)', inp.lambda));
  if (need.lambda0) g3.appendChild(partField('lambda0', 'λ  (the model uses λ + □)', inp.lambda0));
  if (need.sigma) g3.appendChild(permField('sigma', 'σ  (top boundary)', inp.sigma));
  if (need.w) g3.appendChild(permField('w', 'w  (right boundary)', inp.w));
  if (need.u) g3.appendChild(permField('u', 'u', inp.u));
  if (need.v) g3.appendChild(permField('v', 'v', inp.v));
  g3.appendChild(el('button', { class: 'tiny', id: 'f-rand' }, 'Randomise'));
  c.appendChild(g3);

  c.appendChild(specialisationBox(inp, need));
  c.appendChild(advancedBox(inp));

  const acts = el('div', { class: 'grp', style: 'display:flex;gap:8px' });
  acts.appendChild(el('button', { class: 'primary', id: 'f-go', style: 'flex:2' }, 'Compute'));
  acts.appendChild(el('button', { id: 'f-stop', style: 'flex:1' }, 'Stop'));
  c.appendChild(acts);
  c.appendChild(el('div', { id: 'f-errs' }));

  wireControls();
  showErrors();
}

function specialisationBox(inp, need) {
  const d = el('details', UI.prefs.open.spec ? { open: 'open', id: 'd-spec' } : { id: 'd-spec' });
  d.appendChild(el('summary', {}, 'Specialisation'));
  const b = el('div', { class: 'body' });
  const sp = inp.spec;
  const level = sp.level || 'basic';
  const tsym = qSignOf(inp.preset) === -1 ? 'q' : 't';

  const seg = el('div', { class: 'seg wide', style: 'margin-bottom:9px' });
  [['basic', 'basic'], ['composition', 'composition'], ['advanced', 'advanced']]
    .forEach(kv => {
      const btn = el('button', { class: level === kv[0] ? 'on' : '' }, kv[1]);
      btn.onclick = () => { UI.inp.spec.level = kv[0]; renderControls(); compute(); };
      seg.appendChild(btn);
    });
  b.appendChild(seg);

  if (level === 'advanced') {
    const ta = el('div', { class: 'field' });
    ta.innerHTML = '<textarea id="f-advanced" rows="4" spellcheck="false" ' +
      'placeholder="x1 = ' + tsym + '^-1 y2&#10;y3 = 1&#10;x2 = a">' +
      hEsc(sp.advanced || '') + '</textarea>';
    b.appendChild(ta);
    b.appendChild(el('div', { class: 'hint' },
      'One assignment per line, <kbd>variable = monomial</kbd>. The left-hand side is ' +
      '<i>t</i>, <i>x<sub>i</sub></i> or <i>y<sub>j</sub></i>; the right-hand side is a ' +
      'signed monomial in <i>t</i> (or <i>q</i>), the <i>x</i>’s, the <i>y</i>’s and any ' +
      'new letters, which become free parameters, or 0. The assignments are made at ' +
      'once, so <kbd>x1 = y2</kbd> with <kbd>y2 = x1</kbd> is the swap.'));
    d.appendChild(b);
    return d;
  }

  if (need.xSpent) {
    b.appendChild(el('div', { class: 'hint' },
      'This object already substitutes for the <i>x</i> variables.'));
  } else if (level === 'basic') {
    const cur = (sp.u && sp.u.length === inp.n) ? sp.u.join('') : '';
    const f = el('div', { class: 'field' });
    f.innerHTML = '<div class="lbl"><span>restriction |<sub>u</sub> : x<sub>i</sub> ↦ ' +
      'y<sub>u(i)</sub></span></div><input type="text" id="f-specu" value="' + cur +
      '" placeholder="none" spellcheck="false">';
    b.appendChild(f);
    b.appendChild(el('div', { class: 'hint' },
      'A permutation of 1…' + inp.n + ', or blank.'));
  } else {
    b.appendChild(el('div', { class: 'hd', style: 'margin-top:2px' },
      'x<sub>i</sub> ↦ ' + tsym + '<sup>k</sup> y<sub>μ(i)</sub>'));
    const tbl = el('table', { class: 'xmap' });
    let html = '';
    for (let i = 1; i <= inp.n; i++) {
      const m = sp.xmap[i - 1] || { j: 0, k: 0 };
      let opts = '<option value="0">— free —</option>';
      for (let j = 1; j <= Math.max(inp.N, inp.n); j++) {
        opts += '<option value="' + j + '"' + (m.j === j ? ' selected' : '') +
          '>y' + j + '</option>';
      }
      html += '<tr><td><i>x</i><sub>' + i + '</sub> =</td>' +
        '<td>' + tsym + '<sup><input type="number" id="xk-' + i + '" value="' +
        (m.k || 0) + '" step="1"></sup></td>' +
        '<td><select id="xj-' + i + '">' + opts + '</select></td></tr>';
    }
    tbl.innerHTML = html;
    b.appendChild(tbl);
    const quick = el('div', { class: 'field', style: 'margin-top:6px' });
    quick.innerHTML = '<div class="lbl"><span>μ as a list</span></div>' +
      '<div style="display:flex;gap:6px"><input type="text" id="f-uquick" placeholder="' +
      permId(inp.n).join(' ') + '" spellcheck="false">' +
      '<button class="tiny" id="f-ufill">fill</button>' +
      '<button class="tiny" id="f-uclear">clear</button></div>';
    b.appendChild(quick);
    b.appendChild(el('div', { class: 'hint' },
      'With every k = 0 and the μ<sub>i</sub> distinct this is the restriction at the ' +
      'composition μ, as in Remark ' + PAPER.remComposition + '.'));
  }

  const cb = el('div', { style: 'margin-top:10px' });
  cb.innerHTML =
    (need.tSpent
      ? '<div class="hint">This object already sets <i>t</i> = 0.</div>'
      : '<label class="chk"><input type="checkbox" id="f-tzero"' +
        (sp.tZero ? ' checked' : '') + '> set <i>t</i> = 0</label>') +
    (need.ySpent
      ? '<div class="hint">This object already sets every <i>y<sub>j</sub></i> = 0.</div>'
      : '<label class="chk"><input type="checkbox" id="f-yzero"' +
        (sp.yZero ? ' checked' : '') + '> set every <i>y<sub>j</sub></i> = 0 ' +
        '<span class="muted">(Whittaker weights only)</span></label>');
  b.appendChild(cb);
  d.appendChild(b);
  return d;
}

function advancedBox(inp) {
  const d = el('details', UI.prefs.open.adv ? { open: 'open', id: 'd-adv' } : { id: 'd-adv' });
  d.appendChild(el('summary', {}, 'Advanced'));
  const b = el('div', { class: 'body' });
  b.appendChild(el('div', { class: 'hd' }, 'what to compute'));
  const seg = el('div', { class: 'seg wide' });
  [['auto', 'automatic'], ['full', 'all states'], ['random', 'a few states']].forEach(kv => {
    const btn = el('button', { class: inp.mode === kv[0] ? 'on' : '' }, kv[1]);
    btn.onclick = () => { UI.inp.mode = kv[0]; renderControls(); compute(); };
    seg.appendChild(btn);
  });
  b.appendChild(seg);
  b.appendChild(el('div', { class: 'hint' },
    '“All states” enumerates everything and sums the partition function; “a few states” ' +
    'draws a handful found at random and computes no partition function; “automatic” does ' +
    'the first unless there are more states than the threshold below, or the search runs ' +
    'out of time.'));
  const r1 = el('div', { class: 'row', style: 'margin-top:8px' });
  r1.appendChild(numField('timeLimit', 'time limit (s)', inp.timeLimit, 1, 600));
  r1.appendChild(numField('sampleSize', 'states to sample', inp.sampleSize, 1, 200));
  b.appendChild(r1);
  const r2 = el('div', { class: 'row' });
  r2.appendChild(numField('storeLimit', 'keep at most', inp.storeLimit, 10, 200000));
  r2.appendChild(numField('autoLimit', 'automatic threshold', UI.prefs.autoLimit || 3000, 1, 500000));
  b.appendChild(r2);
  const r3 = el('div', { class: 'row' });
  r3.appendChild(numField('factorLimit', 'factoring limit (s)', inp.factorLimit || 10, 1, 120));
  r3.appendChild(el('div', { class: 'field' }, ''));
  b.appendChild(r3);
  b.appendChild(el('div', { class: 'hint' },
    'The count is exact whenever the search finishes; “keep at most” only limits how many ' +
    'states are stored for browsing.'));
  d.appendChild(b);
  return d;
}

function numField(name, label, val, lo, hi) {
  const d = el('div', { class: 'field' });
  d.innerHTML = '<div class="lbl">' + label + '</div>' +
    '<input type="number" id="f-' + name + '" value="' + val + '" min="' + lo +
    '" max="' + hi + '">';
  return d;
}
function permField(name, label, val) {
  const d = el('div', { class: 'field' });
  d.innerHTML = '<div class="lbl"><span>' + label + '</span></div>' +
    '<input type="text" id="f-' + name + '" value="' + (val ? val.join('') : '') +
    '" placeholder="' + permId(UI.inp.n).join('') + '" spellcheck="false">';
  return d;
}
function partField(name, label, val) {
  const d = el('div', { class: 'field' });
  d.innerHTML = '<div class="lbl"><span>' + label + '</span></div>' +
    '<input type="text" id="f-' + name + '" value="' + val.join(' ') + '" spellcheck="false">';
  return d;
}

function readControls(opts) {
  opts = opts || {};
  const inp = UI.inp, need = presetInputs(inp.preset);
  const gv = id => { const e = $(id); return e ? e.value : null; };
  const n = parseInt(gv('f-n'), 10);
  if (n >= 1 && n <= 6 && n !== inp.n) {
    inp.n = n; fixArity(inp); renderControls(); return;
  }
  const rp = (id, cur) => {
    const s = gv(id);
    if (s === null) return cur;
    return parsePerm(s, inp.n) || cur;
  };
  inp.sigma = rp('f-sigma', inp.sigma);
  inp.w = rp('f-w', inp.w);
  inp.u = rp('f-u', inp.u);
  inp.v = rp('f-v', inp.v);
  const pl = (id, cur) => {
    const s = gv(id);
    if (s === null) return cur;
    const a = s.trim().split(/[\s,]+/).filter(z => z !== '').map(Number);
    return (a.length && !a.some(isNaN)) ? a : cur;
  };
  inp.lambda = pl('f-lambda', inp.lambda);
  inp.lambda0 = pl('f-lambda0', inp.lambda0);

  // N belongs to the user; it is only nudged upwards when it would be invalid,
  // and only once they have finished typing.
  if (need.N) {
    const raw = gv('f-N');
    const v = parseInt(raw, 10);
    if (raw !== null && raw !== '' && !isNaN(v)) inp.N = v;
    if (opts.settle && inp.lambda.length === inp.n && inp.N < inp.lambda[0]) {
      inp.N = inp.lambda[0];
      const f = $('f-N'); if (f) f.value = inp.N;
    }
  } else inp.N = inp.n;
  const bx = $('f-box');
  if (bx) {
    bx.checked = inp.N === inp.n &&
      inp.lambda.length === inp.n && inp.lambda.every((a, i) => a === inp.n - i);
  }

  const sp = inp.spec;
  for (let i = 1; i <= inp.n; i++) {
    const j = $('xj-' + i), k = $('xk-' + i);
    if (j) sp.xmap[i - 1] = { j: parseInt(j.value, 10) || 0,
      k: k ? (parseInt(k.value, 10) || 0) : 0 };
  }
  const su = $('f-specu');
  if (su) {
    const txt = (su.value || '').trim();
    sp.u = txt ? (parsePerm(txt, inp.n) || sp.u) : null;
    for (let i = 1; i <= inp.n; i++) {
      sp.xmap[i - 1] = sp.u ? { j: sp.u[i - 1], k: 0 } : { j: 0, k: 0 };
    }
  }
  const tz = $('f-tzero'), yz = $('f-yzero'), ad = $('f-advanced');
  if (tz) sp.tZero = tz.checked;
  if (yz) sp.yZero = yz.checked;
  if (ad) sp.advanced = ad.value;

  const gi = (id, cur, lo, hi) => {
    const v = parseInt(gv(id), 10);
    return isNaN(v) ? cur : Math.max(lo, Math.min(hi, v));
  };
  inp.timeLimit = gi('f-timeLimit', inp.timeLimit, 1, 600);
  inp.storeLimit = gi('f-storeLimit', inp.storeLimit, 10, 200000);
  inp.sampleSize = gi('f-sampleSize', inp.sampleSize, 1, 200);
  inp.factorLimit = gi('f-factorLimit', inp.factorLimit || 10, 1, 120);
  UI.prefs.autoLimit = gi('f-autoLimit', UI.prefs.autoLimit || 3000, 1, 500000);
  showErrors();
}

function showErrors() {
  const errs = validate(UI.inp);
  const box = $('f-errs');
  if (!box) return errs;
  box.innerHTML = '';
  ['n', 'N', 'lambda', 'lambda0', 'advanced'].forEach(f => {
    const e = $('f-' + f); if (e) e.classList.remove('bad');
  });
  for (const e of errs) {
    const f = $('f-' + e.f); if (f) f.classList.add('bad');
    box.appendChild(el('div', { class: 'hint err' }, e.m));
  }
  const need = presetInputs(UI.inp.preset);
  if (!errs.length && need.sigma && need.lambda) {
    const mx = maxCosetRep(UI.inp.sigma, UI.inp.lambda);
    if (!permEq(mx, UI.inp.sigma)) {
      const d = el('div', { class: 'hint fix' },
        'σ is not the maximal-length representative of its coset in ' +
        'S<sub>n</sub>/Stab(w₀·λ); the paper takes σ = ' + mx.join('') + '. Click to use it.');
      d.onclick = () => { UI.inp.sigma = mx; renderControls(); compute(); };
      box.appendChild(d);
    }
  }
  const go = $('f-go');
  if (go) go.disabled = errs.length > 0 || UI.busy;
  return errs;
}

function wireControls() {
  $('f-preset').onchange = () => {
    UI.inp.preset = $('f-preset').value;

  const ids = ['f-n', 'f-N', 'f-sigma', 'f-w', 'f-u', 'f-v', 'f-lambda', 'f-lambda0',

    'f-advanced', 'f-specu'];
  for (let i = 1; i <= UI.inp.n; i++) { ids.push('xj-' + i); ids.push('xk-' + i); }
  ids.forEach(id => {

  });

  $('f-stop').onclick = () => stopJob();

    if (parts.length !== UI.inp.n || parts.some(v => !(v >= 1 && v <= Nmax))) {
      toast('Give ' + UI.inp.n + ' indices between 1 and ' + Nmax + '.'); return;
    }
    for (let i = 1; i <= UI.inp.n; i++) UI.inp.spec.xmap[i - 1] = { j: parts[i - 1], k: 0 };
    renderControls(); compute();

  if (uc) uc.onclick = () => {
    for (let i = 1; i <= UI.inp.n; i++) UI.inp.spec.xmap[i - 1] = { j: 0, k: 0 };
    renderControls(); compute();

/** Fill the boundary fields at random; it does not press Compute.
 *
 *  Permutations are drawn uniformly (Fisher-Yates).  λ is drawn by choosing its
 *  parts in decreasing order, which is NOT uniform over partitions.  The cap on
 *  λ₁ comes from timing, not taste: with the weights multiplied out,
 *      n=3, λ=(6,5,4)        9 states, Z in   65 ms
 *      n=4, λ=(5,4,3,2)     96 states, Z in  123 ms
 *      n=4, λ=(6,5,4,3)     96 states, Z in 2860 ms
 *      n=5, λ=(5,4,3,2,1) 2495 states, Z in 1828 ms
 *      n=5, λ=(6,5,4,3,2) 2495 states, Z does not finish in 8 s
 *  so the cap is n+3 for n ≤ 3, n+1 for n = 4 and n above that. */
function randomise() {
  const inp = UI.inp, need = presetInputs(inp.preset), n = inp.n;
  const rndPerm = () => {
    const p = permId(n);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    return p;
  };
  if (need.w) inp.w = rndPerm();
  if (need.u) inp.u = rndPerm();
  if (need.v) inp.v = rndPerm();
  const boxed = inp.N === inp.n && inp.lambda.every((a, i) => a === n - i);
  if (need.lambda && !boxed) {
    const top = n <= 3 ? n + 3 : (n === 4 ? n + 1 : n);
    const parts = [];
    let cap = top;
    for (let i = 0; i < n; i++) {
      const a = 1 + Math.floor(Math.random() * cap); parts.push(a); cap = a;
    }
    inp.lambda = parts;
    inp.N = parts[0];
  }
  if (need.lambda0) {
    const parts = [];
    let cap = 3;
    for (let i = 0; i < n; i++) {
      const a = Math.floor(Math.random() * (cap + 1)); parts.push(a); cap = a;
    }
    inp.lambda0 = parts;
  }
  if (need.sigma && need.lambda) inp.sigma = maxCosetRep(rndPerm(), inp.lambda);
  else if (need.sigma) inp.sigma = rndPerm();
  renderControls();
  toast('Boundary data randomised — press Compute.');
}

let toastTimer = null;
function toast(msg) {
  let t = $('toast');
  if (!t) { t = el('div', { id: 'toast' }); document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3400);
}

/* ------------------------------------------------------------- the worker */

function makeWorker() {
  try {
    const srcEl = document.getElementById('engine');
    if (!srcEl) return null;
    const code = srcEl.textContent + '\n' + [
      'self.onmessage = function (ev) {',
      '  var d = ev.data;',
      '  self.postMessage({ ack: d.id });',
      '  try { var r = runJob(d); r.id = d.id; self.postMessage(r); }',
      '  catch (err) { self.postMessage({ id: d.id, ok: false, error: String(err && err.message || err) }); }',
      '};'
    ].join('\n');
    const blob = new Blob([code], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob));
  } catch (e) { return null; }
}

function startWorker() {
  UI.worker = makeWorker();
  if (!UI.worker) { UI.workerOk = false; return Promise.resolve(false); }
  UI.worker.onerror = () => { UI.workerOk = false; };
  UI.worker.onmessage = ev => {
    const d = ev.data;
    if (d.ack !== undefined) {
      UI.workerOk = true;
      const p = UI.pending.get(d.ack);
      if (p) clearTimeout(p.ackTimer);
      return;
    }
    const p = UI.pending.get(d.id);
    if (!p) return;
    UI.pending.delete(d.id);
    clearTimeout(p.ackTimer);
    UI.busy = UI.pending.size > 0;
    p.resolve(d);
  };
  return postJob({ probe: true, inp: defaultInput(), timeLimitMs: 500, storeLimit: 10 })
    .then(() => UI.workerOk === true, () => false);
}

function postJob(job) {
  return new Promise((resolve, reject) => {
    job.id = ++UI.jobId;
    if (UI.worker && UI.workerOk !== false) {
      const rec = {
        id: job.id, resolve: resolve, reject: reject,
        ackTimer: setTimeout(() => {
          UI.workerOk = false;
          try { UI.worker.terminate(); } catch (e) {}
          UI.worker = null;
          UI.pending.forEach(r => clearTimeout(r.ackTimer));
          UI.pending.clear();
          setTimeout(() => {
            try { const r = runJob(job); UI.busy = false; resolve(r); }
            catch (e) { UI.busy = false; reject(e); }
          }, 0);
        }, 2500)
      };
      UI.pending.set(job.id, rec);
      UI.busy = true;
      UI.worker.postMessage(job);
    } else {
      UI.busy = true;
      setTimeout(() => {
        try { const r = runJob(job); UI.busy = false; resolve(r); }
        catch (e) { UI.busy = false; reject(e); }
      }, 0);
    }
  });
}

function stopJob() {
  if (!UI.busy) return;
  if (UI.worker && UI.pending.size) {
    UI.pending.forEach(r => clearTimeout(r.ackTimer));
    UI.pending.clear();
    try { UI.worker.terminate(); } catch (e) {}
    UI.worker = null;
    UI.busy = false;
    startWorker();
    renderMain({ stopped: true });
    toast('Stopped.');
  } else {
    toast('This page could not start a Web Worker, so the computation runs in the page and ' +
          'can only stop at its time limit. Serving the file over http restores Stop.');
  }
}

/* -------------------------------------------------------------- computing */

/** What determines the set of states (as opposed to how they are weighted). */
function stateSpaceKey(inp) {
  return [inp.preset, inp.n, inp.N, inp.lambda, inp.sigma, inp.w, inp.u, inp.v,
    inp.lambda0, inp.mode, inp.sampleSize].map(v => JSON.stringify(v)).join('|');
}

function compute() {
  if (UI.page !== 'explore') return;
  const errs = validate(UI.inp);
  if (errs.length) { renderMain({ errs: errs }); return; }
  const key = stateSpaceKey(UI.inp);
  const sameStates = (UI.stateKey === key && UI.inp.mode !== 'random');
  UI.stateKey = key;
  UI.spec = buildSpec(UI.inp);
  UI.facNote = ''; UI.facBusy = false;
  if (!sameStates) { UI.page_ = 0; UI.selected = 0; UI.view = 'grid'; }
  location.replace('#' + encodeInput(UI.inp));
  renderMain({ running: true });
  const t0 = Date.now();
  postJob({ inp: UI.inp, timeLimitMs: UI.inp.timeLimit * 1000,
            storeLimit: UI.inp.storeLimit, mode: UI.inp.mode,
            sampleSize: UI.inp.sampleSize, autoLimit: UI.prefs.autoLimit || 3000 })
    .then(res => {
      UI.busy = false;
      res.wall = Date.now() - t0;
      UI.result = res;
      showErrors();
      renderMain({});
    })
    .catch(err => {
      UI.busy = false;
      renderMain({ error: String(err && err.message || err) });
    });
}

/* --------------------------------------------------------------- rendering */

function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

/** A monomial written in plain text with Unicode sub/superscripts, for the
 *  row and column labels of the picture. */
const SUBD = '₀₁₂₃₄₅₆₇₈₉', SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function subDigits(k) { return String(k).split('').map(d => SUBD[+d]).join(''); }
function supDigits(k) {
  const s = String(Math.abs(k)).split('').map(d => SUPD[+d]).join('');
  return (k < 0 ? '⁻' : '') + s;
}
function paramLabel(spec, slot, fallback) {
  const s = spec.subst[slot];
  if (!s) return fallback;
  if (s.zero) return '0';
  const ring = spec.ring;
  let out = (s.coeff === -1n) ? '−' : (s.coeff === 1n ? '' : String(s.coeff));
  const tsym = spec.tDisplay === 't' ? 't' : 'q';
  const te = spec.tDisplay === 'q=1/t' ? -s.exps[0] : s.exps[0];
  if (te) out += tsym + (te === 2 ? '' : supDigits(te / 2));
  for (let k = 1; k < ring.nv; k++) {
    const e = s.exps[k];
    if (!e) continue;
    const sl = ring.slots[k];
    const nm = sl.kind === 'p' ? sl.name : sl.name + subDigits(sl.idx);
    out += nm + (e === 1 ? '' : supDigits(e));
  }
  return out || '1';
}

function drawOpts(big) {
  const N = UI.spec ? UI.spec.N : 4;
  const spec = UI.spec;
  const labels = {};
  if (UI.prefs.params && spec) {
    labels.rowLabels = [];
    labels.colLabels = [];
    for (let i = 1; i <= spec.n; i++) {
      labels.rowLabels.push(paramLabel(spec, spec.ring.xi(i), 'x' + subDigits(i)));
    }
    for (let j = 1; j <= spec.N; j++) {
      labels.colLabels.push(paramLabel(spec, spec.ring.yj(j), 'y' + subDigits(j)));
    }
  }
  if (big) {
    const unit = N > 8 ? 22 : (N > 6 ? 26 : 30);
    return Object.assign({ unit: unit, radius: unit * 0.47, lw: unit * 0.15,
             fontSize: unit * 0.55, dark: isDark(), params: !!UI.prefs.params }, labels);
  }
  const unit = N > 8 ? 10 : (N > 6 ? 11.5 : 13);
  return Object.assign({ unit: unit, radius: unit * 0.5, lw: unit * 0.19,
           fontSize: unit * 0.66, dark: isDark(), labels: true,
           params: !!UI.prefs.params }, labels);
}

function renderPage() {
  document.querySelectorAll('#pagesw button').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-page') === UI.page);
  });
  $('layout').style.display = UI.page === 'explore' ? '' : 'none';
  $('refpage').style.display = UI.page === 'explore' ? 'none' : '';
  if (UI.page === 'reference' && !$('refpage').dataset.built) {
    $('refpage').innerHTML = referenceHtml();
    $('refpage').dataset.built = '1';
  }
}

function renderMain(flags) {

  if (UI.result.demazure !== 'skipped') m.appendChild(demazureBlock());

  b.innerHTML += '<span class="badge">' + (R.tEnum + (R.tZ || 0)) + ' ms</span>';

  if (R.sampled) {

  }

  const ring = spec.ring;

  // the longest thing on display, which is what "show all" has to act on: with

  };
  if (spec.hasFactor) {

    box.appendChild(el('div', { class: 'k2' }, '× <span class="m">' + spec.factorName +

    (factored(R.facZ, ring) ? ' when multiplied out' : '') + '</span>';
  if (longest > POLY_CAP) {

    bx.onclick = () => {
      UI.prefs.expandPoly = !UI.prefs.expandPoly; savePrefs(); renderMain({});
    };
    tools.appendChild(bx);

  tools.appendChild(factorButton(ring, R, z));

  cp.onclick = () => copyText(polyLatex(z, { tDisplay: spec.tDisplay }));
  tools.appendChild(cp);

  if (R.denom) c.appendChild(denomBlock(ring, R));
  if (spec.note) c.appendChild(el('div', { class: 'note' }, spec.note));
  return c;
}

/** What Remark 4.10 predicts for a composition restriction. */
function compositionNote(ci, z) {
  const spec = UI.spec;
  const zero = P_isZero(z);
  const bits = [];
  bits.push('μ = (' + ci.mu.join(', ') + ') = ν·u with ν = (' + ci.nu.join(', ') +
    ') and u = ' + ci.u.join('') + '; w₀σ⁻¹w = ' + ci.target.join('') + '.');
  if (!ci.sizeOk) {
    bits.push('|ν| &gt; |λ|, outside the range of the remark.');
  } else if (ci.mustVanish) {
    bits.push('Since ' + (ci.nuIsLambda ? 'u ≰ w₀σ⁻¹w' : 'ν ≠ λ') +
      ', Remark ' + PAPER.remComposition + ' gives 0' +
      (zero ? ' ✓' : ' — but the computation is nonzero'));
  } else if (ci.diagonal) {
    bits.push('This is the diagonal case u = w₀σ⁻¹w, where the remark gives a product formula.');
  } else {
    bits.push('ν = λ and u ≤ w₀σ⁻¹w, so the remark does not force vanishing.');
  }
  return el('div', { class: 'hint', style: 'margin-top:8px' }, bits.join(' '));
}

const POLY_CAP = 20;
function polyOpts(spec) {
  return { tDisplay: spec.tDisplay, maxTerms: UI.prefs.expandPoly ? Infinity : POLY_CAP };
}

/** The factorisation to display, or null for the expanded form. */
function factored(facPlain, ring) {
  if (!facPlain || !facPlain.useful) return null;
  if (UI.prefs.showFactored === false) return null;
  return facFromPlain(ring, facPlain);
}

/** “Factor” / “Expand”, with a longer search on demand. */
function factorButton(ring, R, z) {
  const anyUseful = (R.facZ && R.facZ.useful) || (R.facLattice && R.facLattice.useful);
  const b = el('button', { class: 'tiny', id: 'f-factor' });
  if (UI.facBusy) {
    b.innerHTML = '<span class="spin"></span> factoring…';
    b.disabled = true;
    return b;
  }
  if (anyUseful) {
    const showing = UI.prefs.showFactored !== false;
    b.textContent = showing ? 'Expand' : 'Factor';
    b.onclick = () => { UI.prefs.showFactored = !showing; savePrefs(); renderMain({}); };
    return b;
  }
  b.textContent = 'Factor';
  b.title = 'search harder for a factorisation (up to ' +
    Math.round((UI.inp.factorLimit || 10)) + ' s)';
  b.onclick = () => runLongFactor();
  return b;
}

function runLongFactor() {
  const R = UI.result, spec = UI.spec;
  if (!R || !R.z) return;
  UI.facBusy = true; UI.facNote = '';
  renderMain({});
  const budget = (UI.inp.factorLimit || 10) * 1000;
  const jobs = [{ which: 'z', terms: R.z }];
  if (spec.hasFactor && R.zLattice) jobs.push({ which: 'lattice', terms: R.zLattice });
  const each = Math.max(1000, Math.round(budget / jobs.length));
  Promise.all(jobs.map(j => postJob({
    kind: 'factor', which: j.which, terms: j.terms, n: spec.n, N: spec.ring.N,
    extras: spec.extras, budgetMs: each
  }))).then(res => {
    UI.facBusy = false;
    let any = false, timedOut = false, ms = 0;
    for (const r of res) {
      if (!r || !r.fac) continue;
      ms = Math.max(ms, r.fac.ms || 0);
      if (r.fac.timedOut) timedOut = true;
      if (r.which === 'z') R.facZ = r.fac; else R.facLattice = r.fac;
      if (r.fac.useful) any = true;
    }
    UI.prefs.showFactored = true; savePrefs();
    UI.facNote = any ? ''
      : 'No factorisation found' + (timedOut ? ' before the time limit' : '') +
        ' (' + (ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms') +
        '). The search covers monomial, integer and binomial factors.';
    renderMain({});
  }).catch(() => { UI.facBusy = false; renderMain({}); });
}

function denomBlock(ring, R) {
  const d = el('div', {});
  const spec = UI.spec;

  d.appendChild(el('div', { class: 'rlabel', style: 'margin-top:12px' },

  d.appendChild(el('div', { class: 'math' },
    (R.denom.kept.length ? '[ ' : '') + polyHtml(num, polyOpts(spec)) +
    (R.denom.kept.length ? ' ] / ' + den : '')));
  const S = SetSuv(UI.inp.u, UI.inp.v, UI.inp.n);
  const inS = new Set(S.map(a => a[0] + '-' + a[1]));
  const bad = R.denom.kept.filter(f => f.kind === 'one' && !inS.has(f.i + '-' + f.j));
  d.appendChild(el('div', { class: 'hint' },
    'S(u,v) = {' + (S.length ? S.map(a => 'e' + a[0] + '−e' + a[1]).join(', ') : '∅') +
    '}, so |S(u,v)| = ' + S.length + ' and ℓ(v) − ℓ(u) = ' +

    (bruhatLeq(UI.inp.u, UI.inp.v) ? ''

    (bad.length ? ' <b>A surviving denominator factor lies outside S(u,v).</b>' : '')));
  return d;
}

/* --------------------------------------------------------------- states */

function stateWeightShown(bd, st) {
  const spec = UI.spec;
  return P_mul(stateWeight(bd, st, spec.ring, spec.family, spec.subst), spec.factorPoly);
}

function stateIsZeroShown(bd, st) {
  const spec = UI.spec;
  for (const v of stateVertices(bd, st, spec.ring, spec.family, spec.subst)) {
    if (P_isZero(v.weight)) return true;
  }
  return false;
}

function shownStates() {
  const R = UI.result;
  if (!R || !R.ok) return [];
  if (!UI.prefs.onlyNonzero || !UI.spec.hasSubst) return R.states;
  if (!R._nz) {
    R._nz = R.states.filter(e =>
      !stateIsZeroShown(stateBoundary(e), { cuts: e.cuts, horiz: e.horiz }));
  }
  return R._nz;
}

function countNonzero() {
  const R = UI.result;
  if (!R || !R.ok) return 0;
  if (R._nzCount === undefined) {
    R._nzCount = R.states.filter(e =>
      !stateIsZeroShown(stateBoundary(e), { cuts: e.cuts, horiz: e.horiz })).length;
  }
  return R._nzCount;
}

function stateBoundary(entry) {
  const spec = UI.spec;
  return boundaryFromData(spec.n, spec.N, spec.r, spec.sigma, entry.w, spec.lambda);

function diagnoseEmpty() {
  const spec = UI.spec, inp = UI.inp;
  const msgs = [];
  if (spec.preset === 'rpoly' && !bruhatLeq(inp.u, inp.v)) {
    msgs.push('r<sub>u,v</sub> vanishes unless u ≤ v in the Bruhat order, and here u = ' +
      inp.u.join('') + ' ≰ ' + inp.v.join('') + ' = v.');
  }
  const cnt = new Array(spec.r + 1).fill(0);
  for (const m of spec.bd.top) for (const c of maskList(m)) cnt[c]++;
  for (const c of spec.bd.right) if (c) cnt[c]--;
  const off = [];
  for (let c = 1; c <= spec.r; c++) if (cnt[c] !== 0) off.push(c);
  if (off.length) msgs.push('Colours ' + off.join(', ') + ' enter and leave a different ' +
    'number of times, so no state can be admissible.');
  if (!msgs.length) msgs.push('The colours are conserved, but no routing of the paths ' +
    'downward and rightward fits these boundary conditions.');
  return msgs.join(' ');
}

/** The weight of a state as the product of its vertex weights — which is how
 *  the paper presents it, and far more legible than the expansion on a wide
 *  lattice, where a single state can have thousands of terms. */
function weightProductHtml(verts, total, maxFactors) {
  const spec = UI.spec;
  const one = P_const(spec.ring, 1);
  if (P_isZero(total)) {
    const dead = verts.filter(v => P_isZero(v.weight))
      .map(v => '(' + v.row + ', ' + v.col + ')');
    return '0 <span class="muted">— admissible, but the vertex' +
      (dead.length > 1 ? 'es ' : ' ') + dead.join(', ') +
      ' ' + (dead.length > 1 ? 'have' : 'has') + ' weight zero here</span>';
  }
  const o = { tDisplay: spec.tDisplay };
  const groups = [];
  const index = new Map();
  for (const v of verts) {
    if (P_equals(v.weight, one)) continue;
    const h = polyHtml(v.weight, o);
    if (!index.has(h)) { index.set(h, groups.length); groups.push({ h: h, n: 0,
      multi: P_numTerms(v.weight) > 1 }); }
    groups[index.get(h)].n++;
  }
  const bits = groups.map(g => {
    // parenthesise anything that is not a single positive monomial, so the
    // product never reads "... · -t · ..."
    const base = (g.multi || g.h.charAt(0) === '−') ? '(' + g.h + ')' : g.h;
    return g.n === 1 ? base : base + '<sup>' + g.n + '</sup>';
  });
  if (spec.hasFactor) {
    const f = polyHtml(spec.factorPoly, o);
    if (f !== '1') bits.unshift(P_numTerms(spec.factorPoly) > 1 ? '(' + f + ')' : f);
  }
  if (!bits.length) return '1';
  if (maxFactors && bits.length > maxFactors) {
    return bits.slice(0, maxFactors).join(' · ') +
      ' <span class="muted">· … (' + (bits.length - maxFactors) + ' more)</span>';
  }
  return bits.join(' · ');
}

/** The six admissible vertices of the model in use, plus — when a single state
 *  is on screen — the vertex types that actually occur in it, specialised. */
function boltzmannPanel(verts, openKey) {
  const spec = UI.spec;

    : { id: 'd-' + openKey });

  body.appendChild(el('div', { class: 'scroller' }, weightTableHtml(spec.family)));
  body.appendChild(el('div', { class: 'hint' },
    'c &lt; d are colours, Σ is the set on the top edge, Σ<sup>±</sup><sub>c</sub> is Σ with ' +
    'c added or removed, Σ<sup>+−</sup><sub>cd</sub> = (Σ ∪ {c}) ∖ {d}, and x, y are the row ' +
    'and column parameters. Any configuration not listed has weight 0.' +
    (spec.hasSubst
      ? ' Under the specialisation in force an entry vanishes when a displayed exponent ' +

function occurringWeights(verts) {
  const spec = UI.spec;
  const dark = isDark();
  const hz = c => c === PLUS ? '+' : '<b style="color:' + colourOf(c, dark) + '">' + c + '</b>';
  const vz = m => {
    const l = maskList(m);
    if (!l.length) return '+';
    return '{' + l.map(c => '<b style="color:' + colourOf(c, dark) + '">' + c + '</b>')
      .join(',') + '}';
  };
  const seen = new Map();
  for (const v of verts) {
    const key = v.cas + '|' + v.left + '|' + v.top + '|' + v.right + '|' + v.bottom;
    if (!seen.has(key)) seen.set(key, { v: v, at: [] });
    seen.get(key).at.push('(' + v.row + ',' + v.col + ')');
  }
  let rows = '<table class="wt full"><tr><th>at (row, col)</th><th>left</th><th>top</th>' +
    '<th>right</th><th>bottom</th><th>case</th><th>' + FAMILY_LABEL[spec.family] +
    ' weight</th><th>' + (spec.hasSubst ? 'specialised weight' : 'weight here') + '</th></tr>';
  seen.forEach(rec => {
    const v = rec.v;
    rows += '<tr><td class="at">' + rec.at.join(' ') + '</td><td>' + hz(v.left) + '</td><td>' +
      vz(v.top) + '</td><td>' + hz(v.right) + '</td><td>' + vz(v.bottom) + '</td><td>' +
      v.cas + '</td><td>' +
      caseTemplateHtml(spec.family, v.cas, v.left, v.top, v.right, spec.r, v.row, v.col) +
      '</td><td>' + polyHtml(v.weight, { tDisplay: spec.tDisplay }) + '</td></tr>';
  });
  rows += '</table>';
  const d = el('div', {});
  d.appendChild(el('div', { class: 'hd', style: 'margin-top:14px' }, 'in this state'));
  d.appendChild(el('div', { class: 'scroller' }, rows));
  return d;
}

    'τ<sub>σw₀</sub> · [ ' + polyHtml(seed, { maxTerms: 12 }) + ' ]</div>' +

    'x<sup>α<sub>i</sub></sup> = x<sub>i</sub>/x<sub>i+1</sub>; the seed is ' +

function copyText(s) {
  const fallback = () => {
    const ta = el('textarea', { style: 'position:fixed;left:-2000px' });
    ta.value = s; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied.'); } catch (e) { toast('Copy failed.'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(() => toast('Copied.'), fallback);
  } else fallback();
}

function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  UI.prefs.theme = th; savePrefs();
}

function helpDialog() {
  const dlg = el('dialog', { id: 'help' });
  dlg.innerHTML = '<div class="dhead"><h2>How to use this</h2>' +
    '<button class="tiny" id="help-close">close</button></div>' +
    '<div class="dbody">' + HELP_HTML + '</div>';
  document.body.appendChild(dlg);
  $('help-close').onclick = () => dlg.close();
  return dlg;
}

function boot() {
  loadPrefs();
  setTheme(UI.prefs.theme ||
    (matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  UI.inp = fixArity(decodeInput(location.hash));
  renderControls();
  renderPage();
  const dlg = helpDialog();
  $('btn-help').onclick = () => dlg.showModal();
  $('btn-theme').onclick = () => {
    setTheme(isDark() ? 'light' : 'dark');
    $('refpage').dataset.built = '';
    renderPage();
    if (UI.page === 'explore') renderMain({});
  };
  $('btn-link').onclick = () => {
    location.replace('#' + encodeInput(UI.inp));
    copyText(location.href);
  };
  document.querySelectorAll('#pagesw button').forEach(b => {
    b.onclick = () => {
      UI.page = b.getAttribute('data-page');
      renderPage();
      if (UI.page === 'explore' && !UI.result) compute();
    };
  });
  document.addEventListener('keydown', ev => {
    if (ev.target && /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    if (UI.page === 'explore' && UI.view === 'one' && UI.result && shownStates().length) {
      if (ev.key === 'ArrowLeft' && UI.selected > 0) { UI.selected--; renderMain({}); }
      if (ev.key === 'ArrowRight' && UI.selected < shownStates().length - 1) {
        UI.selected++; renderMain({});
      }
    }
  });
  startWorker().then(() => compute(), () => compute());
}

function refVertex(left, top, right, bottom, label) {
  const U = 21, R = 10.5, W = 4 * U + 2 * R, H = 4 * U + 2 * R;
  const cx = W / 2, cy = H / 2;
  const dark = isDark();
  const ink = dark ? '#e8eaed' : '#111';
  const line = dark ? '#8a8f98' : '#444';
  const paper = dark ? '#171a1f' : '#fff';
  const p = [];
  p.push('<line x1="' + (cx - 2 * U) + '" y1="' + cy + '" x2="' + (cx + 2 * U) + '" y2="' +
    cy + '" stroke="' + line + '"/>');
  p.push('<line x1="' + cx + '" y1="' + (cy - 2 * U) + '" x2="' + cx + '" y2="' +
    (cy + 2 * U) + '" stroke="' + line + '"/>');
  const node = (x, y, txt, r) => {
    p.push('<circle cx="' + x + '" cy="' + y + '" r="' + (r || R) + '" fill="' + paper +
      '" stroke="none"/>');
    p.push('<text x="' + x + '" y="' + y + '" font-size="12.5" fill="' + ink +
      '" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif">' +
      txt + '</text>');
  };
  node(cx - 2 * U, cy, left);
  node(cx, cy - 2 * U, top);
  node(cx + 2 * U, cy, right);
  node(cx, cy + 2 * U, bottom);
  node(cx, cy, '<tspan font-size="9.5">' + (label || 'x,y') + '</tspan>', R + 1);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
    p.join('') + '</svg>';
}

/** The crossing picture of the R-matrix: bottom-left, top-left, top-right, bottom-right. */
function refRVertex(bl, tl, tr, br) {
  const U = 22, R = 10.5, W = 3 * U + 2 * R, H = 3 * U + 2 * R;
  const dark = isDark();
  const ink = dark ? '#e8eaed' : '#111';
  const line = dark ? '#8a8f98' : '#444';
  const paper = dark ? '#171a1f' : '#fff';
  const x0 = R, x1 = W - R, y0 = H - R, y1 = R;
  const p = [];
  p.push('<path d="M' + x0 + ' ' + y0 + ' C ' + (x0 + U) + ' ' + y0 + ', ' + (x1 - U) + ' ' +
    y1 + ', ' + x1 + ' ' + y1 + '" fill="none" stroke="' + line + '"/>');
  p.push('<path d="M' + x0 + ' ' + y1 + ' C ' + (x0 + U) + ' ' + y1 + ', ' + (x1 - U) + ' ' +
    y0 + ', ' + x1 + ' ' + y0 + '" fill="none" stroke="' + line + '"/>');
  const node = (x, y, txt, r, fs) => {
    p.push('<circle cx="' + x + '" cy="' + y + '" r="' + (r || R) + '" fill="' + paper +
      '" stroke="none"/>');
    p.push('<text x="' + x + '" y="' + y + '" font-size="' + (fs || 12.5) + '" fill="' + ink +
      '" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif">' +
      txt + '</text>');
  };
  node(x0, y0, bl); node(x0, y1, tl); node(x1, y1, tr); node(x1, y0, br);
  node(W / 2, H / 2, 'x<tspan font-size="7" dy="2">i</tspan>,x<tspan font-size="7">j</tspan>',
    R + 2, 9.5);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
    p.join('') + '</svg>';
}

const S_ALL = '|Σ|', S_CR = '|Σ<sub>(c,r]</sub>|', S_1C = '|Σ<sub>[1,c)</sub>|',

  ['+', 'Σ', 'c', 'Σ<tspan font-size="9">−</tspan><tspan font-size="9" dy="3">c</tspan>'],
  ['c', 'Σ', '+', 'Σ<tspan font-size="9">+</tspan><tspan font-size="9" dy="3">c</tspan>'],
  ['c', 'Σ', 'd', 'Σ<tspan font-size="9">+−</tspan><tspan font-size="9" dy="3">cd</tspan>'],
  ['d', 'Σ', 'c', 'Σ<tspan font-size="9">+−</tspan><tspan font-size="9" dy="3">dc</tspan>']

    sp_('(−t)', S_ALL),
    sp_('t', S_CR) + '(x + ' + sp_('t', S_C) + 'y)',
    sp_('(−t)', S_1C) + sp_('t', S_CR),
    '(1−t) x ' + sp_('(−t)', S_CR),
    '(1−t) x ' + sp_('(−t)', S_CD) + sp_('t', S_DR),
    '−y(1−t) ' + sp_('(−1)', S_CD) + sp_('t', S_DR)],
